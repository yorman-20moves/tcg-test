    <div id="rows"></div>
  </div>

  <div id="main" class="col"><div class="muted" style="padding:40px 0">Loading…</div></div>

  <div id="rail" class="col"><div id="raildyn"></div></div>
</div>

<div id="savebar" hidden>
  <span id="dirtynote">Unsaved changes</span>
  <button class="ghost" id="revert">Revert</button>
  <button class="primary" id="save">Save to file</button>
</div>
<div id="lightbox" hidden><div class="lbcap"></div><img alt=""></div>
<div id="toast" hidden></div>
<div id="tip" hidden role="tooltip"></div>
<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,p={},...kids)=>{const n=document.createElement(t);
  for(const[k,v] of Object.entries(p)){
    if(k==="class")n.className=v; else if(k==="text")n.textContent=v;
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);
    /* aria-* wants the literal strings "true"/"false"; a bare "" neither styles nor announces */
    else if(typeof v==="boolean"){
      if(k.startsWith("aria-")) n.setAttribute(k,String(v));
      else if(v) n.setAttribute(k,"");
    }
    else if(v!==null&&v!==undefined)n.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null) n.append(c.nodeType?c:document.createTextNode(c));
  return n;};
const esc = s => String(s??"");

/* Every render below is a teardown -- replaceChildren() throws away the node the caret is
   sitting in. A render fired from an input handler therefore ate the keystroke: focus fell to
   <body>, the panel scrolled back to the top, and you got one letter per click. renderMain and
   renderRail go through here, which notes which field owned the caret and hands it back to the
   rebuilt one. The match is on an explicit data-focus key because the rebuilt node is a
   different object than the old one -- an editable field inside a re-rendered panel needs a key
   or it will not be restored. */
function preservingFocus(render){
  /* Scroll is saved unconditionally, before anything asks about focus. It used to be saved
     only when the caret sat in a keyed text field, so every checkbox, chip and <select> --
     none of which carry a key -- fell straight through to a bare render(). replaceChildren()
     then collapsed the panel to zero height, the browser clamped scrollTop to 0, and ticking
     a window at the bottom of the page threw you back to the top of it. */
  const panes=[$("#main"),$("#rail")].filter(Boolean);
  const tops=panes.map(p=>p.scrollTop);
  const live=document.activeElement;
  const key=live&&live.dataset?live.dataset.focus:null;
  /* type=number throws on selectionStart rather than returning null, so both ends are read
     and re-applied defensively */
  let head=null, tail=null;
  try{ head=live.selectionStart; tail=live.selectionEnd; }catch{}

  render();

  panes.forEach((p,i)=>{ p.scrollTop=tops[i]; });
  if(!key) return;
  const back=document.querySelector(`[data-focus="${CSS.escape(key)}"]`);
  if(!back || back===live) return;             /* nothing rebuilt it -- the caret never moved */
  back.focus({preventScroll:true});
  if(head!=null && back.setSelectionRange){ try{ back.setSelectionRange(head,tail); }catch{} }
}

const FACTION_VAR = {Warmongers:"--f-warmongers",Overthinkers:"--f-overthinkers",
                     Assholes:"--f-assholes",Icons:"--f-icons"};
const GLYPH = {good:"✓",warning:"!",serious:"!",critical:"✕"};

let DB=null, cards=[], current=null, draft=null;

/* ================= GLOSSARY =============================================================
   Every abbreviation this tool prints. Definitions are lifted from the rulebook and the
   rubrics -- docs/rulebook/06-character-anatomy.md for the stats, 13-glossary.md for the
   universal terms, docs/rubrics/gameplay-rubric.md for the gates, and
   docs/design/balance-philosophy.md for The Score. The validation codes — F…, W… and GAP —
   are NOT here: they come from the server as DB.ruleDocs, read off the rule functions
   themselves, so a tooltip can never drift from what the checker actually does.
   ===================================================================================== */
const GLOSSARY = {
  Cost:["Energy cost","What the card costs to play, and the number the whole budget is derived from: (cost × 3) + 1, plus 3 for an Ascendant."],
  PA:["Physical Attack","Damage dealt by physical strikes. The default stat in a standard Combat Wave."],
  PH:["Physical Health","Physical stamina. At 0 the Character is Murdered. All PH damage is permanent and persists across Rounds."],
  MA:["Mental Attack","Damage dealt by psychological strikes. Reaches the board through Tactics, Attachments and specific abilities — not standard combat unless the card says so."],
  MH:["Mental Health","Mental fortitude. At 0 the Character is Murdered, exactly like PH."],

  G1:["Gate G1 — stays under its Ceiling","Power is earned, not capped. The card may spend up to its Ceiling and no further."],
  G2:["Gate G2 — every term is defined","Every rules term on the card already exists in the rulebook or data/. No card may be the first place a mechanic is defined."],
  G3:["Gate G3 — ability type declared","Every printed ability states its type — Standard, Fast, Trigger or Passive — and the type must be capable of what the text says."],
  G4:["Gate G4 — faction keyword exclusivity","A card carries keywords only from its own faction. No exceptions, including Ascendants. Cross-faction power comes through crew, never keywords."],
  G5:["Gate G5 — no unbounded loop","The card cannot produce infinite Energy, damage, cards or Influence with any existing card."],
  G6:["Gate G6 — deterministic resolution","Two players reading the card reach the same board state. Who chooses, how many, and in what order must all be explicit."],
  G7:["Gate G7 — answerability","At least one existing card can answer this, including from the poorest-tooled faction."],
  G8:["Gate G8 — art and identity present","art.base resolves to a real file, the card has a faction, and a Character has a crew or an explicit null with a reason in Design Notes."],
  G9:["Gate G9 — the friendship gate","Losing to this card must feel like being outplayed or roasted, never robbed or insulted. These are real people. Not a joke gate."],

  budget:["Base Budget","(cost × 3) + 1, plus 3 if the card is an Ascendant. What the printed cost entitles the card to spend."],
  credits:["Credits","Points earned by paying in a currency other than Energy — setup, telegraph, sacrifice, cards, life, matchup narrowness."],
  allowance:["Allowance","Base Budget plus credits. What the card has earned before Reach caps it."],
  ceiling:["Ceiling","The hard limit on what this card may spend: the lower of its Allowance and its Reach cap. Four prohibitions no Ceiling buys past."],
  reach:["Reach","How many factions can answer this card using tools their own toolkit allows — not how many windows it offers. Reach 0 is not printable."],
  window:["Interaction window","A real moment where the opponent can stop the plan. Each one must name a specific existing card or rule; every window raises the Ceiling by 25%."],
  headroom:["Headroom","Ceiling minus what the card actually spends. Negative means it is over and cannot be printed as written."],
  impact:["Spend","Stats plus keyword points plus effect points. What the card actually costs against its budget."],
  tolerance:["Tolerance","How far off budget a card may sit before it counts as off. Under-spending is as wrong as over-spending; it just fails quietly."],

  sigma:["Σ — total stat points","PA + PH + MA + MH added together. The share of the budget spent on raw numbers rather than ideas."],
  delta:["Δ — distance from budget","Points over (+) or under (−) the base budget. ±0 is exactly on."],

  Ascendant:["Ascendant","A Character that levels up mid-game into a second, stronger face. Capped at 5 per 40-card deck."],
  Descendant:["Descendant","A standard Character with one face. The backbone of a deck — a 40-card deck wants about 24."],
  Tactic:["Tactic","A one-shot card played through a Caster of matching faction."],
  Attachment:["Attachment","A persistent card attached to a Character."],
  Arena:["Arena","A card that changes a rule of the game symmetrically, for both players."],

  strong:["Strong","This faction can answer a plan in this window using tools its toolkit already allows."],
  weak:["Weak","This faction has a partial or conditional answer here."],
  blind:["Blind","This faction has no answer in this window at all."],

  unique:["Unique","Only this faction may have this tool. Marking the same tool unique to two factions is a hard error."],
  never:["Never","This faction may never have this tool, even though other factions share it."],
  shared:["Shared","Any faction may use this, unless a faction has explicitly marked it never."],

  Job:["Job","The position a Character plays for its crew — not a keyword. A keyword is a Role: one of the tools it plays the position with."],
  Formation:["Formation","The five-person structure a crew declares: four required Jobs and one free slot."],
  coordinated:["Coordinated","The crew advances one shared plan, and cards may enable each other."],
  chaotic:["Chaotic","Not an exemption from validation, a different rule: no card may require a state a crewmate produces, and none may reference its own crew. In exchange those cards get a higher individual rate."],

  draft:["Draft","Not yet scored or reviewed. Exempt from the budget gate."],
  ported:["Ported","Carried over from the original spreadsheet, numbers intact, not yet re-reviewed."],
  reviewed:["Reviewed","Read against both rubrics and passed."],
  playtested:["Playtested","Has been played in at least one logged game."],
  final:["Final","Locked. Change it only with a very good reason."],
  retired:["Retired","Out of the pool, kept on disk so the Design Notes survive."],

  P1:["P1 — no self-restarting payoff","The payoff may not pay for its own repetition."],
  P2:["P2 — no passive lock","No card may shut the opponent out with no action required from its controller."],
  P3:["P3 — no unbounded repetition","Trigger and Passive abilities bypass the alternating-action structure, so they may not repeat without a bound."],
  P4:["P4 — no cheap + wide + uninterruptible","A card may have two of the three. Never all three."],
};

/* term -> [title, body]; codes come from the server so they track rules.py */
function glossaryFor(key){
  if(GLOSSARY[key]) return GLOSSARY[key];
  if(key.startsWith("family:")){
    const fam=key.slice(7);
    const names=(DB.jobs||[]).filter(j=>j.family===fam).map(j=>j.name);
    if(names.length) return [`${fam} Jobs`,
      `The ${fam} family: ${names.join(", ")}. A Job is the position a Character plays for its crew.`];
    return null;
  }
  const doc=(DB&&DB.ruleDocs)?DB.ruleDocs[key]:null;
  if(doc) return [/^GAP$/.test(key)?"GAP — an unfilled hole":`${key} — validation check`, doc];
  return null;
}

/* Attach an explanation to a node. Works on hover and on keyboard focus, because a
   tooltip only reachable by mouse is a tooltip half the people cannot read. */
function tipped(node, key, {underline=true}={}){
  const g=glossaryFor(key);
  if(!g) return node;
  node.dataset.tipTitle=g[0];
  node.dataset.tip=g[1];
  if(underline) node.classList.add("term");
  if(node.tabIndex<0 && !/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(node.tagName)) node.tabIndex=0;
  return node;
}
/* a bare <span> carrying a term, e.g. the PA in a table header */
const term = (key, label) => tipped(el("span",{text:label??key}), key);

/* Faction and crew already carry a written identity in data/. Show it where the card
   names them, rather than making you leave the screen to remember what a crew is for. */
function factionChip(name){
  const chip=el("span",{class:"fchip"},
    el("span",{class:"dot",style:`background:var(${FACTION_VAR[name]||"--edge"})`}),
    name||"No faction");
  const b=(DB.factions||{})[name];
  if(b && b.identity){
    chip.dataset.tipTitle=`${name} — how they win`;
    chip.dataset.tip=b.identity.split(". ").slice(0,2).join(". ")+".";
    chip.classList.add("term"); chip.tabIndex=0;
  }
  return chip;
}
function crewChip(name){
  const chip=el("span",{text:name||"No crew"});
  const c=crewByName(name);
  if(c && (c.plan||"").trim()){
    chip.dataset.tipTitle=`${name} — the crew plan`;
    chip.dataset.tip=c.plan.trim();
    chip.classList.add("term"); chip.tabIndex=0;
  }
  return chip;
}

function initTips(){
  const box=$("#tip");
  let shown=null;
  const hide=()=>{ shown=null; box.classList.remove("show"); box.hidden=true; };
  const show=node=>{
    if(shown===node) return;
    shown=node;
    box.replaceChildren(el("b",{text:node.dataset.tipTitle||""}), node.dataset.tip);
    box.hidden=false;
    const r=node.getBoundingClientRect();
    box.style.left="0px"; box.style.top="0px";           // measure unconstrained
    const w=box.offsetWidth, h=box.offsetHeight, pad=10;
    const left=Math.min(Math.max(pad, r.left), innerWidth-w-pad);
    let top=r.top-h-8;                                   // above by default
    if(top<pad) top=r.bottom+8;                          // flip under when it would clip
    top=Math.min(Math.max(pad, top), innerHeight-h-pad); // and never leave the viewport
    box.style.left=`${left}px`; box.style.top=`${top}px`;
    box.classList.add("show");
  };
  const target=e=>e.target.closest?.("[data-tip]");
  document.addEventListener("pointerover",e=>{ const t=target(e); t?show(t):hide(); });
  document.addEventListener("pointerdown",hide);
  document.addEventListener("focusin",e=>{ const t=target(e); t?show(t):hide(); });
  document.addEventListener("focusout",hide);
  addEventListener("scroll",hide,true);
  addEventListener("keydown",e=>{ if(e.key==="Escape") hide(); });
}

/* ---------------- scoring (mirrors tools/scoring.py; constants come from the server) --- */
function budgetOf(meta){
  const c=DB.constants;
  const isAsc=(meta.subtype||"").toLowerCase()==="ascendant";
  return Number(meta.cost)*c.costMultiplier + c.baseAllowance + (isAsc?c.ascendantBonus:0);
}
const pointsOf=(names,table)=>(names||[]).reduce((a,n)=>a+(table[n]??0),0);

function scoreDraft(d){
  const m=d.meta, stats=m.stats||{};
  const full = DB.statKeys.every(k=>stats[k]!==null&&stats[k]!==undefined&&stats[k]!=="");
  if(m.cost===null||m.cost===undefined||m.cost==="") return {scorable:false,reason:"no cost defined"};
  if(!full) return {scorable:false,reason:"incomplete stat line"};
  const budget=budgetOf(m);
  const statsTotal=DB.statKeys.reduce((a,k)=>a+Number(stats[k]||0),0);
  const bk=pointsOf(m.base?.keywords,DB.kwPts), be=pointsOf(m.base?.effects,DB.efPts);
  const ak=pointsOf(m.ascended?.keywords,DB.kwPts), ae=pointsOf(m.ascended?.effects,DB.efPts);
  const baseSpent=statsTotal+bk+be, ascSpent=ak+ae;
  const ascBudget=Math.trunc(budget*DB.constants.ascendedMultiplier);
  return {scorable:true,budget,statsTotal,baseKeywordPoints:bk,baseEffectPoints:be,
    ascendedKeywordPoints:ak,ascendedEffectPoints:ae,baseSpent,ascendedSpent:ascSpent,
    baseDelta:budget-baseSpent, ascendedBudget:ascBudget,
    ascendedDelta:ascBudget-(baseSpent+ascSpent)};
}
/* Two-sided on the base budget: underspending is as wrong as overspending. */
function severity(delta){
  const c=DB.constants, m=Math.abs(delta);
  for(const [t,label] of c.severityBands) if(m<=t) return label;
  return c.severityWorst;
}
/* One-sided on the ascended budget: ×1.5 is a ceiling, so spending under it is fine. */
function ceilingSeverity(delta){
  if(delta>=0) return "good";
  const m=Math.abs(delta);
  for(const [t,label] of DB.constants.severityBands) if(m<=t&&t>0) return label;
  return DB.constants.severityWorst;
}

/* Magnitude and direction are different questions. Magnitude picks how loud; direction picks
   which voice. Over runs the system's hot ramp. Under gets one cool tone and no ramp, because
   under is a quiet failure and there is nothing to escalate to.

   Under is a failure only against the BASE budget, which is checked two-sided -- an underspent
   card is a card that does nothing for its cost. Under a CEILING is called headroom and it is
   good, which is exactly what ceilingSeverity already encodes, so one-sided callers can never
   reach the "under" branch. */
function verdictOf(delta, twoSided){
  const cls = twoSided ? severity(delta) : ceilingSeverity(delta);
  if(cls==="good") return {dir:"on", cls:"good", glyph:"✓",
    word: (twoSided||delta<=0) ? "in tolerance" : `${delta} headroom`};
  if(delta>0) return {dir:"under", cls:"under", glyph:"↓", word:`${delta} under`};
  return {dir:"over", cls, glyph: cls==="critical"?"✕":"!", word:`${-delta} over`};
}

/* ---------------- gates (mirrors tools/scoring.py) ------------------------------------ */
function gatesOf(d){
  const m=d.meta, out={G1:[],G3:[],G4:[],G6:[],G8:[]}, s=scoreDraft(d);
  if(s.scorable){
    const p=scorePlan(s);
    if(p.hasPlan){
      if(p.headroom<0) out.G1.push(`spends ${p.total} against a Ceiling of ${p.ceiling} — over by ${-p.headroom}`);
    } else {
      if(Math.abs(s.baseDelta)>DB.constants.tolerance)
        out.G1.push(`base side ${s.baseDelta<0?"over":"under"} budget by ${Math.abs(s.baseDelta)}`);
      if((m.subtype||"").toLowerCase()==="ascendant" && s.ascendedDelta<0)
        out.G1.push(`ascended side exceeds base budget ×${DB.constants.ascendedMultiplier} by ${Math.abs(s.ascendedDelta)} (OQ-04)`);
    }
  }
  const known=new Set([...DB.abilityTypes,...Object.keys(DB.kwPts)]);
  for(const text of [d.rulesText,d.ascendedText]){
    for(const mm of esc(text).matchAll(/\[([^\]]+)\]\s*(\([^)]*\))?/g)){
      const [,name,declared]=mm;
      if(DB.abilityTypes.includes(name)) continue;
      if(!declared) out.G3.push(`ability [${name}] declares no ability type`);
      else if(!known.has(declared.slice(1,-1))) out.G3.push(`ability [${name}] declares unknown type '${declared.slice(1,-1)}'`);
    }
  }
  for(const side of ["base","ascended"])
    for(const kw of (m[side]?.keywords||[])){
      const owner=DB.kwFaction[kw];
      if(!owner) out.G4.push(`unknown keyword '${kw}' on ${side} side`);
      else if(owner!==m.faction) out.G4.push(`${side} keyword '${kw}' belongs to ${owner}, card is ${m.faction}`);
    }
  const blob=`${esc(d.rulesText)}\n${esc(d.ascendedText)}`.toLowerCase();
  const applied=DB.statuses.map(s=>s.name).filter(n=>n&&new RegExp(`\\b${n.toLowerCase()}\\b`).test(blob));
  if(applied.length && !DB.durationPhrases.some(p=>blob.includes(p)))
    out.G6.push(`applies status (${applied.join(", ")}) with no stated duration`);
  if(!m.faction) out.G8.push("no faction");
  if(!m.art?.base) out.G8.push("no base art reference");
  if(!("crew" in m)) out.G8.push("crew key absent");
  return out;
}

/* ---------------- list ---------------------------------------------------------------- */
function listSeverity(c){
  const s=c===current?scoreDraft(draft):c.score;
  return s.scorable?severity(s.baseDelta):"none";
}
function renderList(){
  if(MODE==="library"){ $("#rows").replaceChildren(); return; }
  if(MODE==="factions"||MODE==="crews"){
    const rows=$("#rows"); rows.replaceChildren();
    const items = MODE==="factions" ? (DB.factionData||[]) : (DB.crews||[]);
    const sel   = MODE==="factions" ? selFaction : selCrew;
    for(const it of items){
      const n = MODE==="factions" ? cardsOf(it.name).length : cardsOf(null,it.name).length;
      rows.append(el("button",{class:"cardrow","aria-current":sel&&sel.key===it.key,
        /* Same shape as clicking a card row: #main is about to show a different faction or
           crew's detail entirely, so it starts at the top rather than at wherever the one
           you just left was scrolled to. */
        onclick:()=>{ if(MODE==="factions") selFaction=it; else selCrew=it; renderList(); renderMain();
          $("#main").scrollTop=0; }},
        el("span",{class:"fbar",style:`background:var(${FACTION_VAR[it.name]||"--baseline"})`}),
        el("span",{class:"nm",text:it.name}),
        it.reviewed?null:el("span",{class:"dot warning",style:"background:var(--warning)",title:"unreviewed draft"}),
        el("span",{class:"cost",text:String(n)})));
    }
    return;
  }
  if(MODE!=="cards"){ $("#rows").replaceChildren(); return; }
  const q=$("#q").value.toLowerCase(), fac=$("#ffac").value, bal=$("#fbal").value;
  const rows=$("#rows"); rows.replaceChildren();
  const groups=new Map();
  for(const c of cards){
    const m=c.meta, sev=listSeverity(c);
    /* search the whole card, not just the name -- "counterspell" or "prowler" should find
       every card that uses it */
    const hay=[m.name,m.crew,m.faction,m.subtype,m.status,
               ...(m.base?.effects||[]),...(m.base?.keywords||[]),
               ...(m.ascended?.effects||[]),...(m.ascended?.keywords||[]),
               c.rulesText,c.ascendedText].join(" ").toLowerCase();
    if(q && !hay.includes(q)) continue;
    if(fac && m.faction!==fac) continue;
    if(bal==="off" && (sev==="none"||sev==="good")) continue;
    if(bal==="good" && sev!=="good") continue;
    if(bal==="stub" && sev!=="none") continue;
    const key=m.crew||"Unassigned";
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(c);
  }
  if(!groups.size){ rows.append(el("div",{class:"crewgroup",text:"No cards match"})); return; }
  for(const [crew,items] of [...groups].sort((a,b)=>a[0].localeCompare(b[0]))){
    rows.append(el("div",{class:"crewgroup",text:`${crew} · ${items.length}`}));
    for(const c of items){
      const sev=listSeverity(c);
      rows.append(el("button",{class:"cardrow","aria-current":c===current,
          onclick:()=>select(c)},
        el("span",{class:"fbar",style:`background:var(${FACTION_VAR[c.meta.faction]||"--baseline"})`}),
        el("span",{class:`dot ${sev}`,title:sev}),
        el("span",{class:"nm",text:c.meta.name}),
        el("span",{class:"cost",text:c.meta.cost??"–"})));
    }
  }
}

/* ---------------- main surface -------------------------------------------------------- */
/* the old meter() lived here; meterV() replaced it, so that the glyph and the word travel
   with the fill colour rather than colour carrying the verdict on its own */

/* ---------------- the proof ------------------------------------------------------------
   The card as an object, next to the arithmetic that decides whether it can be printed.
   Built once per card and updated in place: the artwork is multi-megabyte and renderMain
   runs on every keystroke, so rebuilding the <img> here would flash on every edit. */
let PROOF=null;
function buildProof(){
  PROOF=null;
  if(!current) return;
  const art=draft.art||{};
  const face=(side,label)=>{
    const a=art[side]||{};
    const inner = a.url
      ? el("img",{src:a.url,alt:`${draft.meta.name} — ${label}`})
      : el("div",{class:"noart"}, el("div",{},
          el("div",{class:"slug",text:label}),
          el("div",{style:"margin-top:6px"},
            a.ref?`No file matches “${a.ref}”`:"No art reference set")));
    return inner;
  };
  const spine=el("div",{class:"spine"});
  const pip=el("div",{class:"pip"});
  const cname=el("div",{class:"cname"});
  const cstats=el("div",{class:"cstats"});
  const front=el("div",{class:"side front"}, face("base","Base"), spine, pip,
                 el("div",{class:"plate"}, cname, cstats));
  const back =el("div",{class:"side back"}, face("ascended","Level-up"),
                 el("div",{class:"plate"}, el("div",{class:"slug",style:"color:#cfc8bb",
                   text:"Level-up side"})));
  const card=el("div",{class:"cardface"}, el("div",{class:"flipper"}, front, back));

  const sw=el("div",{class:"faceswitch"});
  const show=key=>{
    PROOF.face=key;
    card.classList.toggle("flipped", key==="ascended");
    for(const b of sw.children) b.setAttribute("aria-pressed", String(b.dataset.k===key));
  };
  for(const [key,label] of [["base","Base"],["ascended","Level-up"]])
    sw.append(el("button",{"data-k":key,"aria-pressed":key==="base",text:label,
      onclick:()=>show(key)}));
  const zoom=el("button",{class:"zoomlink",text:"Open full artwork",onclick:()=>{
    const a=art[PROOF.face]||{};
    if(a.url) lightbox(a.url,`${draft.meta.name} — ${PROOF.face==="base"?"Base":"Level-up"} · ${a.path}`);
    else toast("No artwork on that side yet");
  }});
  PROOF={node:el("div",{}, card, sw, zoom), card, spine, pip, cname, cstats, face:"base"};
}
function syncProof(){
  if(!PROOF) return;
  const m=draft.meta;
  PROOF.spine.style.background=`var(${FACTION_VAR[m.faction]||"--edge"})`;
  PROOF.pip.textContent = (m.cost===null||m.cost===undefined||m.cost==="") ? "–" : String(m.cost);
  PROOF.cname.textContent = m.name||"Untitled";
  PROOF.cstats.replaceChildren(...DB.statKeys.map(k=>
    el("span",{}, k+" ", el("b",{text:String(m.stats?.[k] ?? "–")}))));
}

/* one row of the receipt: label, leader dots, right-aligned figure */
function line(label, value, cls=""){
  return el("div",{class:cls},
    el("span",{class:"lbl",text:label}),
    el("span",{class:"dots"}),
    el("span",{class:"v",text:String(value)}));
}

/* A card-text field: the card's own words, set like printed text rather than like a form.
   Grows to fit so there is never a scrollbar inside the card's voice. */
function cardText(label, key, placeholder, tipKey){
  const ta=el("textarea",{class:"cardtext",placeholder,"data-focus":"card:"+key,
    oninput:e=>{ draft[key]=e.target.value; grow(e.target); touch(false); }}, draft[key]||"");
  const count=el("span",{class:"cnt"});
  const grow=n=>{ n.style.height="auto"; n.style.height=Math.max(52,n.scrollHeight+2)+"px";
                  count.textContent=(n.value||"").trim()?`${n.value.trim().length} chars`:"empty"; };
  requestAnimationFrame(()=>grow(ta));
  const lbl=el("span",{class:"slug",text:label});
  if(tipKey) tipped(lbl, tipKey);
  return el("div",{}, el("div",{class:"textlabel"}, lbl, count), ta);
}

/* The card's words, next to the card's face, next to the card's arithmetic. Reading the
   text and the budget in two different scroll positions is how a card gets priced without
   anyone re-reading what it actually does. */
function faceText(){
  return el("div",{class:"facetext"},
    el("div",{class:"side-rule",text:"Base side"}),
    cardText("Rules text","rulesText",
      "[Ability Name] (Standard Ability): what it does, who chooses, how many.","G3"),
    el("div",{class:"side-rule lvl",text:"Level-up"}),
    cardText("Level-up condition","levelupCondition",
      "What has to happen for this Character to ascend.","Ascendant"),
    cardText("Ascended rules text","ascendedText",
      "[Improved Ability] (Fast Ability): what changes once it has ascended.","G3"));
}

/* meter(), but carrying the whole verdict so the glyph and the word travel with the colour
   and nothing is left to hue alone. */
function meterV(label, spent, limit, v){
  const max=Math.max(spent,limit,1), pct=x=>Math.min(100,(x/max)*100);
  return el("div",{class:"meter"},
    el("div",{class:"cap"},
      el("span",{},label),
      el("span",{class:`${v.cls}-c`,style:"font-weight:600"},
        el("span",{class:`glyph ${v.cls}-bg`,text:v.glyph}), " ",
        el("b",{text:String(spent)}), " / ", el("b",{text:String(limit)}), " · ", v.word)),
    el("div",{class:"track"},
      el("div",{class:"fill",style:`width:${pct(spent)}%;background:var(--${v.cls})`}),
      el("div",{class:"budgetmark",style:`left:calc(${pct(limit)}% - 1px)`,title:`limit ${limit}`})));
}

/* The credit's own words from data/plan-credits.yaml, with the quantity folded in. Falls back
   to the label so a credit added later without copy still reads as a sentence. */
function creditSentence(def, n){
  const raw=def.sentence||("Because of "+def.label.toLowerCase());
  return raw.replace(/\{n\}/g,String(n)).replace(/\{s\}/g, n===1?"":"s");
}

/* One ledger, read top to bottom as sentences: what the card is allowed to spend, then what it
   actually spends, then what to do about the difference.

   It replaces two separate verdicts that used to sit 500px apart in two visual languages --
   this panel answered "on budget?" against the base budget while The Score answered "does it
   fit?" against the Ceiling. For a card that declares a plan those are different questions with
   different answers, and nothing on screen said which one was the real one. */
function verdictPanel(s){
  const m=draft.meta, cfg=DB.plan, plan=planOf(), p=scorePlan(s,plan);
  const row=(label,value,cls="")=>el("div",{class:"r "+cls},
    el("span",{class:"lbl",text:label}), el("span",{class:"dots"}),
    el("span",{class:"v",text:value===null?"":String(value)}));
  const note=t=>el("div",{class:"sub",text:t});
  const rule=()=>el("div",{class:"rule"});
  const isAsc=(m.subtype||"").toLowerCase()==="ascendant";
  const led=el("div",{class:"vledger"});

  led.append(row(`Because it costs ${m.cost} Energy`, m.cost*DB.constants.costMultiplier),
             note(`Every point of Energy buys ${DB.constants.costMultiplier} points of power.`),
             row("Because every card gets a base allowance", "+"+DB.constants.baseAllowance));
  if(isAsc) led.append(row("Because it's an Ascendant — it has two faces",
                           "+"+DB.constants.ascendantBonus));
  led.append(rule());

  if(!p.hasPlan){
    /* No plan declared, so the card is held to two separate limits, exactly as _gate_g1
       checks them: the base side against the budget, and both faces against 1.5x it. */
    led.append(row("BASE BUDGET — what the base side may spend", s.budget, "tot"),
               row(`Both faces together may spend ${DB.constants.ascendedMultiplier}× that`,
                   s.ascendedBudget));
  } else {
    led.append(row("BASE BUDGET", s.budget, "tot"));
    const table=Object.fromEntries(cfg.credits.map(c=>[c.key,c]));
    for(const [k,q] of Object.entries(plan.pays||{})){
      const def=table[k]; if(!def||!q) continue;
      let raw=def.points*q;
      if(k==="narrowness") raw=Math.min(raw,cfg.narrowness_cap);
      const f=costFactor(k,plan), earned=Math.trunc(raw*f);
      led.append(row(creditSentence(def,q), "+"+earned),
        note(f===1 ? `${def.points} each — ${def.anchor||"see the balance philosophy"}.`
                   : `${q} × ${def.points} = ${raw}, then ×${f} — ${def.anchor||""}`.trim()));
    }
    led.append(rule(),
      row("ALLOWANCE — budget plus what it pays in other currencies", p.allowance, "tot"));
    const known=Object.keys(DB.factions||{});
    const cant=known.filter(n=>!p.answering.includes(n));
    if(p.cap===null){
      led.append(el("div",{class:"notprintable"},
        el("b",{text:"Reach 0 — not printable. "}),
        "No faction can answer this card in any window it declares, so there is no cap to "
        +"collect its credits under. Declare a window some faction is strong in."));
    } else if(p.reach!==null){
      led.append(row(`But only ${p.reach} faction${p.reach===1?"":"s"} can answer it, `
                     +`so it's capped at ${(cfg.reach_caps||{})[p.reach]}× base`, p.cap),
        note((p.answering.length?`${p.answering.join(" and ")} can. `:"No faction can. ")
          +(cant.length?`${cant.join(" and ")} ${cant.length===1?"is":"are"} blind.`:"")
          +(p.reachOverridden?`  You have overridden this — computed Reach is ${p.reachComputed}.`:"")));
    }
    led.append(rule(), row("CEILING — the most this card may spend", p.ceiling, "tot"));
  }

  const names=a=>(a&&a.length)?a.join(", "):"none";
  const act=el("div",{class:"vledger"},
    row(`Its stats — ${DB.statKeys.map(k=>`${k} ${m.stats?.[k]??"–"}`).join(" · ")}`, s.statsTotal),
    row(`Its base keywords — ${names(m.base?.keywords)}`, "+"+s.baseKeywordPoints),
    row(`Its base effects — ${names(m.base?.effects)}`, "+"+s.baseEffectPoints),
    rule(), row("BASE SIDE SPENDS", s.baseSpent, "tot"),
    row(`Its level-up keywords — ${names(m.ascended?.keywords)}`, "+"+s.ascendedKeywordPoints),
    row(`Its level-up effects — ${names(m.ascended?.effects)}`, "+"+s.ascendedEffectPoints),
    rule(), row("BOTH FACES SPEND", s.baseSpent+s.ascendedSpent, "tot"));

  const bars=el("div",{});
  let head;
  if(p.hasPlan){
    head=verdictOf(p.headroom,false);
    bars.append(meterV("Both faces against the Ceiling", p.total, p.ceiling, head));
  } else {
    head=verdictOf(s.baseDelta,true);
    bars.append(meterV("Base side against its budget", s.baseSpent, s.budget, head),
      meterV(`Both faces against ${DB.constants.ascendedMultiplier}× budget`,
             s.baseSpent+s.ascendedSpent, s.ascendedBudget, verdictOf(s.ascendedDelta,false)));
  }

  return el("div",{},
    el("span",{class:"herolabel vhead",text:"Potential power — what this card is allowed to spend"}),
    led,
    el("span",{class:"herolabel vhead",text:"Actual impact — what it really spends"}),
    act, bars, decisionLine(s,p,head));
}

/* What to actually do about it. The old panel stated the verdict and stopped, which is fine
   only if you already know what raises a ceiling and what spends one. */
function decisionLine(s,p,v){
  const step=DB.constants.costMultiplier;
  if(v.dir==="on"){
    /* A card with a plan is measured against its Ceiling, where spending less is headroom
       rather than a fault -- so it must not be told it is "exactly on budget" while the meter
       beside it reads 4 headroom. */
    if(p.hasPlan && p.headroom>0)
      return el("div",{class:"decision"}, el("b",{text:`${p.headroom} points of headroom. `}),
        "The plan has earned more ceiling than the card spends. Either spend it — this card can "
        +`carry ${p.headroom} more points of impact — or simplify the plan, because you are `
        +"paying setup for power you are not taking.");
    return el("div",{class:"decision"}, el("b",{text:"Exactly on budget. "}),
      "It spends precisely what its cost buys.");
  }
  if(v.dir==="under")
    return el("div",{class:"decision"}, el("b",{text:`${s.baseDelta} under. `}),
      "This is weaker than its cost pays for — underpowered is as wrong as overpowered here, "
      +`it just fails quietly instead of loudly. Add ${s.baseDelta} points of impact, or drop `
      +`the cost by 1, which takes ${step} points of budget away with it.`);
  const over = p.hasPlan ? -p.headroom : -s.baseDelta;
  const blind = p.hasPlan ? Object.keys(DB.factions||{}).filter(n=>!p.answering.includes(n)) : [];
  return el("div",{class:"decision"}, el("b",{text:`${over} over. `}),
    `Cut ${over} points of impact, or buy more ceiling: +1 Energy buys ${step} points`,
    p.hasPlan ? ", and giving a blind faction a window it can actually use raises the cap."
              : ", or declare a plan that earns a higher ceiling.",
    blind.length ? ` Right now ${blind.join(" and ")} ${blind.length===1?"has":"have"} no answer at all.` : "");
}

function proofPanel(s){
  syncProof();
  const right=el("div",{});
  if(s.scorable){
    right.append(verdictPanel(s));
  } else {
    right.append(
      el("span",{class:"herolabel",text:"Not scorable yet"}),
      el("div",{class:"verdictword",text:"Stub"}),
      el("div",{class:"verdictwhy",style:"font-size:13px",
        text:`${s.reason} — set a cost and all four stats below to start scoring it.`}));
  }
  return el("div",{class:"proof"}, PROOF?PROOF.node:el("div",{}), faceText(), right);
}

function stepper(label, value, onChange, min=0){
  const input=el("input",{type:"number",value:value??"",min:String(min),"aria-label":label,
    "data-focus":"step:"+label,
    oninput:e=>onChange(e.target.value===""?null:Number(e.target.value))});
  const bump=d=>{const v=(Number(input.value)||0)+d; if(v<min)return;
    input.value=v; onChange(v);};
  return el("div",{class:"stepper"},
    tipped(el("div",{class:"lb",text:label}), label, {underline:false}),
    el("div",{class:"ctl"},
      el("button",{class:"sbtn",text:"−","aria-label":`decrease ${label}`,"data-focus":"step-dn:"+label,onclick:()=>bump(-1)}),
      input,
      el("button",{class:"sbtn",text:"+","aria-label":`increase ${label}`,"data-focus":"step-up:"+label,onclick:()=>bump(1)})));
}

/* The filter query outlives the re-render a tick triggers. touch() rebuilds the whole picker,
   so a query held only in the input's own value was destroyed by the very act of ticking a
   result -- you got one effect per retype, which is not a way to use a 51-entry list. */
const EF_QUERY={base:"",ascended:""};

function effectPicker(side){
  const chosen=draft.meta[side].effects;
  const search=el("input",{class:"efsearch",placeholder:`Filter ${DB.effects.length} effect types…`,
    "data-focus":"efsearch:"+side, value:EF_QUERY[side]||""});
  const list=el("div",{class:"eflist"});
  const selected=el("div",{class:"sel"});
  const drawSelected=()=>{
    selected.replaceChildren(...chosen.map(n=>
      el("span",{class:"tag"}, `${n} · ${DB.efPts[n]??"?"}`,
        el("button",{text:"×","aria-label":`remove ${n}`,onclick:()=>{
          chosen.splice(chosen.indexOf(n),1); touch(); }}))));
    if(!chosen.length) selected.append(el("span",{class:"muted",text:"None selected"}));
  };
  const drawList=()=>{
    const q=(EF_QUERY[side]||"").toLowerCase();
    const matching=DB.effects.filter(e=>e.name.toLowerCase().includes(q));
    /* selected first -- otherwise what you already picked scrolls out of sight */
    matching.sort((a,b)=>(chosen.includes(b.name)?1:0)-(chosen.includes(a.name)?1:0));
    list.replaceChildren(...matching.map(e=>{
      const on=chosen.includes(e.name);
      return el("label",{class:"efrow",style:"align-items:flex-start"},
        el("input",{type:"checkbox",checked:on,style:"margin-top:3px",
          "data-focus":"ef:"+side+":"+e.name,onchange:ev=>{
          if(ev.target.checked){ if(!chosen.includes(e.name)) chosen.push(e.name); }
          else chosen.splice(chosen.indexOf(e.name),1);
          touch();
        }}),
        el("span",{class:"nm",style:"white-space:normal"},
          el("span",{style:"font-weight:600"},e.name),
          /* the definition inline, not in a tooltip -- having to hover 51 entries to
             remember what they mean is the friction this is here to remove */
          el("div",{class:"d",text:e.description||"— no definition written —"})),
        el("span",{class:"pts",style:"margin-top:2px",text:String(e.points)}));
    }));
  };
  search.addEventListener("input",()=>{ EF_QUERY[side]=search.value; drawList(); });
  drawSelected(); drawList();
  return el("div",{},search,list,selected);
}

function keywordChips(side){
  const chosen=draft.meta[side].keywords;
  const mine=DB.keywords.filter(k=>k.faction===draft.meta.faction);
  const chips=el("div",{class:"chips"}, ...mine.map(k=>{
    const on=chosen.includes(k.name);
    return el("button",{class:"chip","aria-pressed":on,"data-focus":"kw:"+side+":"+k.name,onclick:()=>{
      on?chosen.splice(chosen.indexOf(k.name),1):chosen.push(k.name); touch();}},
      k.name, el("span",{class:"pts",text:(k.points>0?"+":"")+k.points}));
  }), mine.length?null:el("span",{class:"muted",text:"No keywords defined for this faction"}));
  /* Definitions always on screen. Having to remember what a Role does, or hover to find out,
     is the friction this removes -- there are only a handful per faction, so show them all. */
  const defs=el("div",{class:"kwdefs"}, ...mine.map(k=>
    el("div",{class:`kwdef ${chosen.includes(k.name)?"on":""}`},
      el("b",{text:k.name}), " — ", k.definition||"no definition written")));
  return el("div",{}, chips, mine.length?defs:null);
}

/* the old generic textarea() helper lived here; the card's three text fields moved into
   the proof as cardText(), which auto-grows and sits beside the face and the budget */


function planOf(){
  draft.meta.plan = draft.meta.plan || {};
  draft.meta.plan.pays = draft.meta.plan.pays || {};
  draft.meta.plan.windows = draft.meta.plan.windows || [];
  return draft.meta.plan;
}

/* Mirrors scoring.py. Credits earn the Allowance; Reach CAPS it.
   Each cost is discounted by the three tests (bite / timing / enabler).

   Both take the plan explicitly rather than reaching for the module-level draft through
   planOf(), because planOf() can only ever describe the card currently open -- which made it
   impossible to score every card at once and check this mirror against the server's. */
function costFactor(key, plan){
  const scales=DB.plan.cost_tests||{}, chosen=(plan.tests||{})[key]||{};
  let f=1;
  for(const [test,opts] of Object.entries(scales)){
    const ans=chosen[test];
    if(ans!==undefined && opts[ans]!==undefined) f*=Number(opts[ans]);
  }
  return f;
}

/* Which factions can actually answer a card offering these windows -- the same question
   scoring.py's Plan._answering asks, off the same window profiles in data/factions.yaml.
   null means no faction carries a profile at all, which is the one case where falling back
   to counting windows is right. */
function answeringFactions(windows){
  const briefs=DB.factions||{}, names=Object.keys(briefs);
  if(!names.length) return null;
  const declared=new Set(windows||[]);
  return names.filter(n=>{
    const prof=(briefs[n]||{}).windows||{};
    for(const w of declared) if(prof[w]==="strong") return true;
    return false;
  });
}

/* The server ships its own authoritative score for every card in the bootstrap payload, which
   makes this mirror directly testable against it. It exists because the two silently stopped
   agreeing: this file computed Reach from how many windows were ticked, while scoring.py
   computes it from how many factions are strong in one, so the Studio could show a Ceiling
   check.py disagreed with and nothing said so. Stays quiet when they agree. */
function parityCheck(){
  const out=[];
  for(const c of cards){
    if(!c.score || !c.score.scorable) continue;   /* stubs: both sides agree there is nothing to score */
    const js=scoreDraft(c), p=scorePlan(js, c.meta.plan||{});
    const mine={budget:js.budget, baseSpent:js.baseSpent, baseDelta:js.baseDelta,
                reach:p.reach, ceiling:p.ceiling, headroom:p.headroom};
    for(const [field,value] of Object.entries(mine))
      if(value!==c.score[field]) out.push({name:c.meta.name, field, js:value, py:c.score[field]});
  }
  return out;
}

function scorePlan(s, plan){
  plan = plan || planOf();
  const cfg=DB.plan;
  const table=Object.fromEntries(cfg.credits.map(c=>[c.key,c]));
  let credits=0;
  for(const [k,q] of Object.entries(plan.pays||{})){
    const e=table[k]; if(!e||!q) continue;
    let raw=e.points*q;
    if(k==="narrowness") raw=Math.min(raw,cfg.narrowness_cap);
    credits+=Math.trunc(raw*costFactor(k,plan));
  }
  const valid=new Set(cfg.windows.map(w=>w.key));
  const declaredWindows=(plan.windows||[]).filter(w=>valid.has(w));
  const windows=declaredWindows.length;
  const declared = credits>0 || windows>0 || plan.reach!=null;

  /* Reach is how many FACTIONS can answer it, not how many windows you ticked. Counting
     windows was this file's own invention, and it disagreed with the checker. */
  const answering=answeringFactions(declaredWindows);
  const reachComputed = windows>0
    ? (answering===null ? Math.min(4,windows) : answering.length)
    : null;
  const reachOverridden = plan.reach!=null;
  const reach = reachOverridden ? Math.max(0,Math.min(4,plan.reach)) : reachComputed;
  const allowance=s.budget+credits;
  const caps=cfg.reach_caps||{};
  let cap;
  if(reach===null) cap=s.budget;                       // no plan: the original rule
  else {
    const mult = caps[reach]!==undefined ? caps[reach] : caps[String(reach)];
    cap = (mult===null||mult===undefined) ? null : Math.trunc(s.budget*Number(mult));
  }
  const ceiling = cap===null ? 0 : Math.min(allowance,cap);
  const total=s.baseSpent+s.ascendedSpent;
  return {credits,windows,declaredWindows,reach,reachComputed,reachOverridden,
          answering:answering||[],allowance,earned:allowance,cap,ceiling,total,
          headroom:ceiling-total, hasPlan:declared};
}

/* The controls that raise the ceiling. What they add up to is stated once, in the verdict
   panel at the top of the page -- this panel used to repeat the whole sum in its own bar. */
function scorePanel(s){
  const cfg=DB.plan, plan=planOf(), p=scorePlan(s);

  const grid=el("div",{class:"creditgrid"});
  for(const c of cfg.credits){
    const q=plan.pays[c.key]||0;
    const set=v=>{ if(v<=0) delete plan.pays[c.key]; else plan.pays[c.key]=v; touch(); };
    /* The anchor is the entire justification for the price. It used to be a title= attribute,
       which is to say it was invisible. */
    let raw=c.points*q;
    if(c.key==="narrowness") raw=Math.min(raw,cfg.narrowness_cap);
    const f=costFactor(c.key,plan);
    grid.append(el("div",{class:`credit ${q?"on":""}`},
      el("div",{class:"lb",text:c.label}),
      c.anchor?el("div",{class:"anchor",text:`Worth ${c.points} because ${c.anchor}.`}):null,
      el("div",{class:"rw"},
        el("div",{class:"val"},
          el("button",{class:"sbtn",text:"−","aria-label":`less ${c.key}`,
            "data-focus":"credit-dn:"+c.key,onclick:()=>set(q-1)}),
          el("input",{type:"number",min:"0",value:String(q),"aria-label":c.label,
            "data-focus":"credit:"+c.key,
            oninput:e=>set(Math.max(0,Number(e.target.value)||0))}),
          el("button",{class:"sbtn",text:"+","aria-label":`more ${c.key}`,
            "data-focus":"credit-up:"+c.key,onclick:()=>set(q+1)})),
        el("span",{class:"pts",text:`${c.points>=0?"+":""}${c.points} ea`})),
      /* The three tests were three dropdowns reading "bite…", "timing…", "enabler…". One of
         the answers multiplies the credit by zero. Nothing on screen said so. */
      q?el("div",{class:"tests"}, ...Object.entries(cfg.cost_tests||{}).map(([test,opts])=>{
        const copy=(cfg.cost_test_copy||{})[test]||{};
        const chosen=((plan.tests||{})[c.key]||{})[test];
        const pick=v=>{ plan.tests=plan.tests||{}; plan.tests[c.key]=plan.tests[c.key]||{};
          if(v) plan.tests[c.key][test]=v; else delete plan.tests[c.key][test];
          touch(); };
        return el("div",{class:"testblock"},
          el("div",{class:"testq",text:copy.question||test}),
          copy.why?el("div",{class:"testwhy",text:copy.why}):null,
          el("div",{class:"testopts"}, ...Object.keys(opts).map(o=>{
            const oc=((copy.options||{})[o])||{};
            return el("button",{class:"testopt","aria-pressed":chosen===o,
              "data-focus":`test:${c.key}:${test}:${o}`,
              onclick:()=>pick(chosen===o?null:o)},
              el("b",{text:oc.label||o}),
              oc.note?el("span",{class:"note",text:oc.note}):null,
              el("span",{class:"mult",text:"×"+Number(opts[o]).toFixed(1)}));
          })));
      })):null,
      q?el("div",{class:"creditmath",

                    : `${q} × ${c.points} = ${raw}  →  ×${f}  →  ${Math.trunc(raw*f)} points earned`}):null));
  }

  /* Reach stops being a number to guess at. It is computed from which factions are strong in
     the windows this card actually offers, which is the same question scoring.py asks. */
  const reachBox=el("div",{});
  if(p.declaredWindows.length){
    const tbl=el("div",{class:"reachtable"});
    for(const n of Object.keys(DB.factions||{})){

    reachBox.append(tbl);
  } else {
    reachBox.append(el("div",{class:"muted",style:"font-size:11.5px;margin:4px 0 8px"},

    reachRow.append(el("button",{class:"chip","aria-pressed":on,
      title:n===0?"nobody can answer it — not printable":`cap = base × ${(cfg.reach_caps||{})[n]}`,
      "data-focus":"reach:"+n,

  if(p.reachOverridden)
    reachRow.append(el("button",{class:"chip","data-focus":"reach:auto",
      onclick:()=>{ delete plan.reach; touch(); }},"use computed"));
  reachRow.append(el("span",{class:"muted",style:"font-size:11.5px"},
    "only if you know something the window profiles in data/factions.yaml do not"));
  reachBox.append(reachRow);

  const wins=el("div",{class:"windows"});
  for(const w of cfg.windows){
    const on=plan.windows.includes(w.key);
    wins.append(el("label",{class:`win ${on?"on":""}`},
      el("input",{type:"checkbox",checked:on,"data-focus":"win:"+w.key,onchange:ev=>{
        if(ev.target.checked){ if(!plan.windows.includes(w.key)) plan.windows.push(w.key); }
        else plan.windows.splice(plan.windows.indexOf(w.key),1);

      }}),
      el("span",{}, el("b",{text:w.label}), " ", el("span",{class:"q",text:w.question}))));
  }

  const proh=el("div",{class:"proh"});

      tipped(el("span",{class:"gid",text:x.key}), x.key),
      el("span",{class:"msg"}, el("b",{text:x.label}), " — ", x.test)));

  return el("div",{class:"panel"},
    el("div",{class:"row spread"},
      el("h3",{text:"What raises the ceiling"}),
      el("span",{class:"muted",style:"font-size:11.5px",
        text:p.hasPlan?"plan declared":"no plan — capped at base budget"})),
    el("label",{class:"fl",text:"Energy cost — the only control here that raises the budget directly"}),
    el("div",{class:"grid",style:"grid-template-columns:repeat(4,1fr);max-width:480px"},
      stepper("Cost", draft.meta.cost, v=>{draft.meta.cost=v; touch();}, 0)),
    el("label",{class:"fl",text:"What it pays (beyond Energy)"}), grid,
    el("label",{class:"fl"},term("reach","Reach")), reachBox,
    el("label",{class:"fl"},"Which ",term("window","windows")," exist — each must name a real card or rule"), wins,
    el("div",{class:"muted",style:"font-size:11.5px;margin-top:10px"},

/* A complaint without a move is just a complaint. The four human gates carry their own
   description from the server and are not machine-checkable, so they get no fix line. */
const GATE_FIX={
  G1:"Cut impact, raise the cost, or declare a plan that earns a higher ceiling.",
  G3:"Name the type in parentheses after the ability — (Standard Ability), (Fast Ability), (Trigger Ability) or (Passive Ability).",
  G4:"Keywords never cross factions. Swap it for one of this faction's own, or move the card.",
  G6:"Say how long it lasts — “until the end of the round”, “permanently”, “this turn”.",
  G8:"Set the missing piece: a faction, a base art reference, or an explicit `crew: null` with a reason in Design Notes.",
};

/* Session-scoped, keyed by card. The four human gates were plain checkboxes with nothing behind
   them, so any re-render silently unticked them -- reading a card against G9 and then touching a
   stat threw the answer away. Not written to the card file: that would be a schema change, and
   the schema is not this change's to move. */
const HUMAN_TICKS=new Set();
const humanKey=id=>`${draft.relPath}|${id}`;

function gateStrip(){
  const g=gatesOf(draft);
  const wrap=el("div",{class:"panel"},
    el("div",{class:"row spread",style:"margin-bottom:10px"},
      el("h3",{text:"Can it be printed"}),
      el("span",{class:"muted",style:"font-size:11.5px",text:"machine-checked · G2/G5/G7/G9 are your call"})));
  const pills=el("div",{class:"gatepills"});
  for(const [id,fails] of Object.entries(g)){
    const ok=fails.length===0;
    pills.append(tipped(el("span",{class:`pill ${ok?"ok":"bad"}`,
        title:fails.join("; ")||"pass"},
      el("span",{class:`glyph ${ok?"good":"critical"}-bg`,text:ok?"✓":"✕"}), id),
      id, {underline:false}));
  }
  wrap.append(pills);
  const failing=Object.entries(g).filter(([,f])=>f.length);
  for(const [id,fails] of failing)
    for(const msg of fails)
      wrap.append(el("div",{class:"gate"},
        tipped(el("span",{class:"gid",text:id}), id),
        el("span",{class:"swatch critical-bg"}),
        el("span",{class:"msg"}, msg,
          GATE_FIX[id]?el("div",{class:"gatefix",text:GATE_FIX[id]}):null)));
  const human=el("div",{class:"humangates"});
  /* No touch() here: reading a card against G9 is not an edit to the card, and marking it
     dirty over it would put a Save prompt in front of an answer that changes no file. */
  for(const [id,desc] of Object.entries(DB.humanGates))
    human.append(el("label",{class:"hg"},
      el("input",{type:"checkbox",checked:HUMAN_TICKS.has(humanKey(id)),"data-focus":"hg:"+id,
        onchange:e=>{ const k=humanKey(id);
          e.target.checked?HUMAN_TICKS.add(k):HUMAN_TICKS.delete(k); }}),
      tipped(el("b",{text:id}), id),
      el("span",{class:"sec",text:desc})));
  wrap.append(human);
  return wrap;
}

function siblingTable(){
  const m=draft.meta;
  const cost=m.cost;
  const inRange = c => cost!==null && cost!==undefined
    && c.meta.cost!==null && c.meta.cost!==undefined
    && Math.abs(c.meta.cost-cost)<=1;
  /* One cost either side, not just exact matches -- at the tails of the curve an exact-cost
     filter often returns the card itself, which compares it to nothing. */
  const sibs=cards.filter(inRange)
    .sort((a,b)=>(a.meta.cost-b.meta.cost)||a.meta.name.localeCompare(b.meta.name));
  const tbl=el("table",{class:"sib"},
    el("thead",{}, el("tr",{}, ...["Card","","Cost",...DB.statKeys,"Σ","Δ"].map(h=>{
      const key = h==="Σ" ? "sigma" : h==="Δ" ? "delta" : h;
      return el("th",{}, glossaryFor(key) ? term(key,h) : h);
    }))));
  const tb=el("tbody",{});
  for(const c of sibs){
    const isSelf=c===current, cs=isSelf?scoreDraft(draft):c.score;
    const st=isSelf?(m.stats||{}):(c.meta.stats||{});
    const sev=cs.scorable?severity(cs.baseDelta):"none";
    tb.append(el("tr",{class:isSelf?"self":(c.meta.cost===cost?"":"off")},
      el("td",{class:"nm",text:isSelf?m.name:c.meta.name}),
      el("td",{class:"nm"}, el("span",{class:"dot",style:`background:var(${FACTION_VAR[c.meta.faction]||"--baseline"})`})),
      el("td",{text:String(isSelf?cost:c.meta.cost)}),
      ...DB.statKeys.map(k=>el("td",{text:String(st[k]??"–")})),
      el("td",{class:"muted",text:cs.scorable?String(cs.statsTotal):"–"}),
      el("td",{}, cs.scorable
        ? el("span",{style:"font-weight:600"},
            el("span",{class:`swatch ${sev}-bg`}),
            (cs.baseDelta<0?"+":cs.baseDelta>0?"−":"±")+Math.abs(cs.baseDelta))
        : el("span",{class:"muted",text:"–"}))));
  }
  tbl.append(tb);
  const exact=sibs.filter(c=>c.meta.cost===cost).length;
  return el("div",{class:"panel"},
    el("div",{class:"row spread",style:"margin-bottom:10px"},
      el("h3",{
        text:`Neighbours — cost ${cost===null||cost===undefined?"—":`${Math.max(0,cost-1)}–${cost+1}`}`}),
      el("span",{class:"muted",style:"font-size:11.5px",
        text:`${exact} at cost ${cost ?? "—"} · ${sibs.length-exact} adjacent`})),
    sibs.length?tbl:el("div",{class:"muted",text:"Set a cost to compare against other cards."}),
    el("div",{class:"muted",style:"font-size:11.5px;margin-top:10px",
      text:"Σ is total stat points. Δ is points over (+) or under (−) budget. A 4-cost is only a 4-cost relative to its neighbours."}));
}

function renderModes(){
  const host=$("#modes"); host.replaceChildren();
  const errs=(DB.findings||[]).filter(f=>f.severity==="error").length;
  for(const [key,label] of MODE_LIST){
    const bad = key==="problems" && errs>0;
    host.append(el("button",{class:`mode ${bad?"bad":""}`,"aria-current":MODE===key,
      onclick:()=>setMode(key)}, label,
      key==="problems"?el("span",{class:"n",text:String(errs||(DB.findings||[]).length)}):null));
  }
  $("#cardfilters").style.display = MODE==="cards" ? "" : "none";
  $("#cardactions").style.display  = MODE==="cards" ? "" : "none";
  $("#poolcount").textContent = `${cards.length} cards`;
}
function setMode(m){
  MODE=m;
  /* the rail is card context -- collapse it everywhere else so the wide views get the space */
  $("#app").style.gridTemplateColumns = (m==="cards") ? "" : "var(--roster) 1fr 0";
  $("#rail").style.display = (m==="cards") ? "" : "none";
  document.documentElement.style.setProperty("--rail", m==="cards" ? "344px" : "0px");
  renderModes(); renderList(); renderMain(); renderRail();
  /* Same reasoning as select(): a mode switch puts an unrelated screen in #main (and, coming
     back to Cards, an unrelated card in #rail), not a redraw of the one you were just reading.
     Carrying the old scroll position over would land you partway down a screen you have not
     looked at yet, which is the bug this whole file exists to not have. */
  [$("#main"),$("#rail")].filter(Boolean).forEach(p=>p.scrollTop=0);
}

let libKind="keywords", libSel=null, libQuery="";
const LIB_META={keywords:{label:"Keywords",noun:"keyword",hasFaction:true,hasPoints:true,
                          defKey:"definition"},
                effects:{label:"Effects",noun:"effect",hasFaction:false,hasPoints:true,
                          defKey:"description"},
                statuses:{label:"Status effects",noun:"status",hasFaction:false,hasPoints:false,
                          defKey:"description"}};
function libRows(kind){
  return kind==="keywords" ? (DB.keywords||[])
       : kind==="effects"  ? (DB.effects||[])
       : (DB.statuses||[]);
}
function uniqueOwnerOf(kind,name){
  const bucket = kind==="keywords" ? "keywords" : "effects";
  for(const f of DB.factionData||[])
    if((((f.unique||{})[bucket])||[]).includes(name)) return f.name;
  return null;
}
function neverFor(kind,name){
  const bucket = kind==="keywords" ? "keywords" : "effects";
  return (DB.factionData||[]).filter(f=>(((f.never||{})[bucket])||[]).includes(name))
                             .map(f=>f.name);
}
async function libSave(entry, originalName){
  const j=await postJSON("/api/library",{kind:libKind,entry,originalName});
  if(libKind==="keywords") DB.keywords=j.rows; else if(libKind==="effects") DB.effects=j.rows;
  else DB.statuses=j.rows;
  DB.usage=j.usage; DB.findings=j.findings;

  DB.kwFaction=Object.fromEntries((DB.keywords||[]).map(k=>[k.name,k.faction]));
  DB.efPts=Object.fromEntries((DB.effects||[]).map(e=>[e.name,e.points]));

  /* window profile */
  const wg=el("table",{class:"wingrid"},
    el("thead",{},el("tr",{},el("th",{text:"Window"}),el("th",{text:"This faction"}),el("th",{text:"Covered by"}))));
  const tb=el("tbody",{});
  for(const w of DB.windowKeys){
    const cur=(f.windows||{})[w]||"blind";
    const covered=(DB.factionData||[]).filter(x=>(x.windows||{})[x==f?"":""]||((x.windows||{})[w]==="strong")).map(x=>x.name);
    const cycle=()=>{ f.windows=f.windows||{};
      f.windows[w]={strong:"weak",weak:"blind",blind:"strong"}[cur]; renderMain(); };
    tb.append(el("tr",{},
      el("td",{text:DB.windowLabels[w]}),
      el("td",{}, tipped(el("span",{class:`lvl ${cur}`,onclick:cycle,
        title:"click to cycle"},cur), cur, {underline:false})),
      el("td",{}, covered.length<2
        ? el("span",{class:"warning-c"}, el("span",{class:"swatch warning-bg"}), covered.join(", ")||"nobody")
        : covered.join(", "))));
  }
  wg.append(tb);
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Window profile — where they can answer a plan"}),
    wg,
    el("div",{class:"muted",style:"font-size:11.5px;margin-top:9px"},
      "Click a level to cycle strong → weak → blind. This map is what computes Reach on every card.")));

  /* toolkit */
  for(const [kind,title] of [["keywords","Keywords"],["effects","Effects"]]){
    const pool = kind==="keywords" ? DB.keywords.map(k=>k.name) : DB.effects.map(e=>e.name);
    const uniq=new Set(((f.unique||{})[kind])||[]);
    const never=new Set(((f.never||{})[kind])||[]);
    const wrap=el("div",{class:"tools"});
    for(const name of pool){
      const owner=uniqueOwner(kind,name,f.key);
      const cls = uniq.has(name)?"uniq" : never.has(name)?"never" : owner?"taken":"";
      wrap.append(el("button",{class:`tool ${cls}`,
        title: owner ? `already unique to the ${owner}` : "click: shared → unique → never → shared",
        onclick:()=>{
          if(uniq.has(name)){ uniq.delete(name); never.add(name); }
          else if(never.has(name)){ never.delete(name); }
          else {
            if(owner){ toast(`"${name}" is already unique to the ${owner} — it can only be unique to one faction.`,5000); return; }
            uniq.add(name);
          }
          f.unique=f.unique||{}; f.never=f.never||{};
          f.unique[kind]=[...uniq]; f.never[kind]=[...never];
          renderMain();
        }}, name, owner?el("span",{class:"muted",text:` · ${owner}`}):null));
    }
    main.append(el("div",{class:"panel"},
      el("h3",{text:`${title} — unique / never`}),
      el("div",{class:"muted",style:"font-size:11.5px;margin:4px 0 2px"},
        "blue = unique to this faction · red = never · faded = already unique to someone else"),
      wrap));
  }
}

/* --------------------------------- JOBS ----------------------------------- */
/* A Job is what a Character does for its crew. A Role (keyword) is one of the tools it does
   it with. The rulebook already spends "Role" on faction-exclusive keywords, so these are
   deliberately different words for deliberately different things. */

const jobsAll     = () => DB.jobs || [];
const jobByKey    = k => jobsAll().find(j => j.key === k) || null;
const factionKey  = name => ((DB.factionData||[]).find(f => f.name === name) || {}).key || null;
const isExemptFac = name => !!((DB.factionData||[]).find(f => f.name === name) || {}).exempt;
const JOB_FAMILIES=[["front","Front"],["damage","Damage"],["support","Support"],
                    ["specialist","Specialist"]];

/* Can this faction hold this Job? null `factions` means any. */
function jobAllowed(job, facName){
  if(!job || !job.factions || !job.factions.length) return true;
  const k = factionKey(facName);
  return !k || job.factions.includes(k);
}

/* Does the card carry any of the Job's signature tools? Guidance, never law. */
function jobSignatureHit(job, meta){
  const sig = job && job.signature || {};
  const want = new Set([...(sig.keywords_any||[]), ...(sig.effects_any||[])]);
  if(!want.size) return null;                       // nothing mechanical to check
  const held = [ ...(meta.base?.keywords||[]), ...(meta.base?.effects||[]),
                 ...(meta.ascended?.keywords||[]), ...(meta.ascended?.effects||[]) ];
  return held.some(h => want.has(h));
}

function jobPanel(d){
  const m = d.meta;
  if(isExemptFac(m.faction)){
    return el("div",{class:"panel"},
      el("h3",{text:"Job"}),
      el("div",{class:"muted",style:"font-size:12px;margin-top:6px"},
        "Icons hold no Job and no Formation. They are one-person armies, not crew members, "+
        "and they are deliberately outside the consistency system."));
  }
  const job = jobByKey(m.job);
  const hit = job ? jobSignatureHit(job, m) : null;

  const picker = el("div",{class:"chips",style:"margin-top:6px"});
  picker.append(el("button",{class:"chip","aria-pressed":!m.job,
    onclick:()=>{ m.job=null; touch(); renderMain(); }},"— none —"));
  for(const [fam,label] of JOB_FAMILIES){
    const inFam = jobsAll().filter(j => j.family === fam);
    if(!inFam.length) continue;
    picker.append(tipped(el("span",{class:"famlabel",text:label}),"family:"+fam,{underline:false}));
    for(const j of inFam){
      const ok  = jobAllowed(j, m.faction);
      const bits=["chip"];
      if(!ok) bits.push("faded");
      if(j.status==="unbuilt") bits.push("faded");
      picker.append(el("button",{class:bits.join(" "),"aria-pressed":m.job===j.key,
        title: (!ok ? `${m.faction} may not hold this Job. ${j.faction_note||""}`
                    : j.status==="unbuilt" ? `No mechanics exist for this Job yet. ${j.unbuilt_reason||""}`
                    : j.identity||""),
        onclick:()=>{ m.job=j.key; touch(); renderMain(); }}, j.name));
    }
  }

  const body=[el("h3",{text:"Job — what this card does for its crew"}),
              el("div",{class:"muted",style:"font-size:11.5px;margin-top:3px"},
                "Not the same as a keyword. A keyword is a Role: one of the tools. The Job is the position."),
              picker];

  if(job){
    /* legality is a hard error — say so loudly and say why */
    if(!jobAllowed(job, m.faction)){
      body.push(el("div",{class:"stub"},
        el("span",{class:"glyph critical-bg",text:GLYPH.critical}),
        el("b",{text:` ${m.faction} cannot hold ${job.name}. `}),
        job.faction_note || `Restricted to ${job.factions.join(", ")}.`));
    }
    /* signature fit is guidance — a nudge, not a wall */
    if(hit === false){
      const sig=job.signature||{};
      const want=[...(sig.keywords_any||[]), ...(sig.effects_any||[])];
      body.push(el("div",{class:"stub"},
        el("span",{class:"glyph warning-bg",text:GLYPH.warning}),
        el("b",{text:` Doesn't look like a ${job.name} yet. `}),
        `A ${job.name} usually shows one of: ${want.slice(0,6).join(", ")}`+
        (want.length>6?"…":"")));
    }
    const line=(k,v)=> v ? el("div",{style:"margin-top:6px"},
      el("span",{class:"muted",style:"font-size:11px",text:k+" "}),
      el("span",{style:"font-size:12.5px",text:String(v).trim()})) : null;
    body.push(el("div",{style:"margin-top:10px;padding-top:10px;border-top:1px solid var(--gridline)"},
      line("The job", job.job),
      line("Beats", job.beats),
      line("Loses to", job.loses_to),
      line("The line", job.line),
      job.note ? line("Note", job.note) : null));
  }
  return el("div",{class:"panel"}, ...body.filter(Boolean));
}

/* ------------------------------ FORMATIONS -------------------------------- */
/* A Formation names four required Jobs and leaves one slot free. Four slots are
   near-mandatory; the fifth is where the crew says something about itself. */

function formationPanel(c, members){
  const forms = DB.formations || [];
  const f = forms.find(x => x.key === c.formation) || null;
  const eligible = members.filter(m => !isExemptFac(m.meta.faction));
  const held = new Map();                            // job key -> [card names]
  for(const m of eligible)
    if(m.meta.job) held.set(m.meta.job, [...(held.get(m.meta.job)||[]), m.meta.name]);

  const picker = el("div",{class:"chips",style:"margin-top:6px"});
  picker.append(el("button",{class:"chip","aria-pressed":!c.formation,
    onclick:()=>{ c.formation=null; renderMain(); }},"— not declared —"));
  for(const x of forms)
    picker.append(el("button",{class:"chip"+(x.coordination==="chaotic"?" faded":""),
      "aria-pressed":c.formation===x.key, title:x.plan,
      onclick:()=>{ c.formation=x.key;
                    c.coordination = x.coordination || c.coordination; renderMain(); }}, x.name));

  const body=[el("h3",{text:"Formation — the five-person structure"}),
              el("div",{class:"muted",style:"font-size:11.5px;margin-top:3px"},
                "Lore leads → the plan follows the lore → the Formation follows the plan. "+
                "Four required Jobs, one free slot."),
              picker];

  if(f){
    body.push(el("div",{style:"margin-top:12px;font-size:12.5px",text:f.plan.trim()}));

    if(f.rule === "no_internal_enablers"){
      body.push(el("div",{class:"stub"},
        el("b",{text:"This is not an exemption from validation — it is a different rule. "}),
        (f.rule_detail||"").trim()));
      body.push(el("div",{class:"muted",style:"font-size:11.5px;margin-top:8px",
        text:(f.compensation||"").trim()}));
    } else {
      const rows = el("div",{class:"grid",style:"margin-top:10px"});
      for(const key of f.required_jobs){
        const job = jobByKey(key) || {name:key};
        const who = held.get(key) || [];
        const ok  = who.length > 0;
        rows.append(el("div",{class:"row",style:"gap:8px;align-items:baseline"},
          el("span",{class:`glyph ${ok?"good":"warning"}-bg`,text:ok?GLYPH.good:GLYPH.warning}),
          el("b",{style:"font-size:12.5px",text:job.name}),
          el("span",{class:"muted",style:"font-size:12px",
            text: ok ? who.join(", ") : "nobody in this crew does this job"})));
      }
      /* the free slot, and whatever is sitting in it */
      const extra = [...held.keys()].filter(k => !f.required_jobs.includes(k));
      rows.append(el("div",{class:"row",style:"gap:8px;align-items:baseline;margin-top:6px;padding-top:8px;border-top:1px solid var(--gridline)"},
        el("span",{class:"glyph",style:"background:var(--baseline)",text:"·"}),
        el("b",{style:"font-size:12.5px",text:"Free slot"}),
        el("span",{class:"muted",style:"font-size:12px",
          text: extra.length ? extra.map(k=>(jobByKey(k)||{name:k}).name).join(", ")
                             : (f.free_slot||"").trim()})));
      body.push(rows);
      body.push(el("div",{class:"muted",style:"font-size:11.5px;margin-top:10px",
        text:`Loses to: ${(f.loses_to||"").trim()}`}));
    }
  }
  return el("div",{class:"panel"}, ...body.filter(Boolean));
}

/* -------------------------------- CREWS ---------------------------------- */
let selCrew=null;
function renderCrews(main){
  const c = selCrew || (DB.crews||[])[0];
  if(!c){ main.append(el("div",{class:"muted",text:"No crews defined."})); return; }
  selCrew=c;
  const members=cardsOf(null,c.name);
  const save=async()=>{
    const r=await fetch("/api/crew",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({crew:c})});
    const j=await r.json();
    if(j.error) return toast("Save failed: "+j.error,6000);
    DB.crews=j.crews; DB.findings=j.findings;
    toast(`Saved ${c.name}`); renderModes(); renderMain(); renderRail();
  };
  main.append(el("div",{class:"topbar"},
    el("div",{class:"row spread"},
      el("div",{},
        el("h2",{class:"screentitle",text:c.name}),
        el("div",{class:"muted",style:"font-size:12px;margin-top:3px",
          text:`${members.length} cards across ${new Set(members.map(m=>m.meta.faction)).size} factions · ${c.reviewed?"reviewed":"DRAFT"}`})),
      el("button",{class:"primary",onclick:save},"Save crew"))));

  main.append(el("div",{class:"panel"},
    el("h3",{text:"The plan — how does this crew win a game?"}),
    el("textarea",{rows:"3",oninput:e=>{c.plan=e.target.value;}},c.plan||""),
    el("label",{class:"fl",text:"Lore basis — why the plan follows from who they are"}),
    el("textarea",{rows:"3",oninput:e=>{c.lore_basis=e.target.value;}},c.lore_basis||""),
    el("label",{class:"fl",text:"Signature"}),
    el("textarea",{rows:"1",oninput:e=>{c.signature=e.target.value;}},c.signature||""),
    el("label",{class:"fl",text:"Coordination"}),
    el("div",{class:"chips"},
      ...["coordinated","chaotic"].map(k=>tipped(el("button",{class:"chip","aria-pressed":c.coordination===k,
        title:k==="chaotic"?"exempt from the single-plan rule, but chaos must be mechanically real":"",
        onclick:()=>{c.coordination=k; renderMain();}},k), k, {underline:false}))),
    el("label",{class:"win",style:"display:flex;gap:8px;margin-top:12px;cursor:pointer"},
      el("input",{type:"checkbox",checked:!!c.reviewed,onchange:e=>{c.reviewed=e.target.checked;}}),
      el("span",{},"I have reviewed this crew's plan"))));

  main.append(formationPanel(c, members));

  /* roads */
  const expr = c.expressions = c.expressions || [];
  const rows=el("div",{class:"grid"});
  const seen={};
  for(const m of members.sort((a,b)=>a.meta.name.localeCompare(b.meta.name))){

    rows.append(el("div",{},

        m.meta.name, dupe?el("span",{class:"warning-c",text:"  · duplicate road"}):null),
      el("textarea",{rows:"2","data-focus":"road:"+slug,
        placeholder:"the different road this card takes to the crew's plan",
        oninput:e=>{entry.road=e.target.value; renderMain();}},entry.road||"")));
  }
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Roads — every card must reach the plan a different way"}),
    el("div",{class:"muted",style:"font-size:11.5px;margin:4px 0 8px"},
      "If you can't write a distinct road for a card, that card is a duplicate."),
    rows));
}

/* ------------------------------- MATRIX ---------------------------------- */
function renderMatrix(main){
  const facs=(DB.factionData||[]).map(f=>f.name);
  const crewNames=[...new Set(cards.map(c=>c.meta.crew||"Unassigned"))].sort();
  main.append(el("div",{class:"topbar"},el("h2",{class:"screentitle",text:"Crew × Faction"}),
    el("div",{class:"muted",style:"font-size:12px",text:"click a card to open it · hatched = empty"})));
  const t=el("table",{class:"matrix"});
  t.append(el("thead",{},el("tr",{}, el("th",{class:"rowh",text:"Crew"}),
    ...facs.map(f=>el("th",{}, el("span",{class:"dot",style:`display:inline-block;margin-right:5px;background:var(${FACTION_VAR[f]||"--baseline"})`}), f)),
    el("th",{text:"total"}))));
  const tb=el("tbody",{});
  for(const crew of crewNames){
    const tr=el("tr",{});
    tr.append(el("td",{class:"rowh",text:crew}));
    let total=0;
    for(const f of facs){
      const list=cardsOf(f,crew==="Unassigned"?null:crew).filter(c=>(c.meta.crew||"Unassigned")===crew);
      total+=list.length;
      const cell=el("div",{class:`cell ${list.length?"":"empty"}`});
      for(const c of list){
        const sc=c.score;
        /* red = the BASE side is off. Nearly every card fails the ascended-side check today
           (OQ-04), so colouring on that would make the whole grid red and say nothing. */
        const over = sc.scorable && sc.baseSeverity && sc.baseSeverity!=="good";
        cell.append(el("button",{class:`mini ${over?"over":""}`,title:c.meta.name,
          onclick:()=>{ setMode("cards"); select(c); }},
          c.meta.name.split(",")[0]));
      }
      tr.append(el("td",{},cell));
    }
    tr.append(el("td",{style:"text-align:center;font-variant-numeric:tabular-nums;padding:8px",text:String(total)}));
    tb.append(tr);
  }
  const foot=el("tr",{});
  foot.append(el("td",{class:"rowh",text:"total"}));
  for(const f of facs) foot.append(el("td",{style:"text-align:center;padding:8px;font-variant-numeric:tabular-nums",
    text:String(cardsOf(f).length)}));
  foot.append(el("td",{style:"text-align:center;padding:8px;font-weight:600",text:String(cards.length)}));
  tb.append(foot);
  t.append(tb);
  main.append(el("div",{class:"panel"},t));
}

/* ------------------------------- HEALTH ---------------------------------- */
function renderHealth(main){

  const scorable=cards.filter(c=>c.score.scorable);
  /* base side only -- nearly every card fails the ascended-side check today (OQ-04), so the
     raw headroom number is 25/25 and tells you nothing actionable. */
  const over=scorable.filter(c=>c.score.baseSeverity!=="good");
  const legalDeck = cards.filter(c=>(c.meta.subtype||"")!=="Ascendant").length;
  main.append(el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px"},
    el("div",{class:"kpi"},el("div",{class:"v",text:String(cards.length)}),el("div",{class:"l",text:"cards"})),
    el("div",{class:`kpi`},el("div",{class:`v ${over.length?"critical-c":""}`,text:String(over.length)}),
      el("div",{class:"l",text:"base side off"})),

/* The lore packet's counterpart to syncProof: the three things in the rail that read the lore
   text, updated without going near the textareas the words are being typed into. */
let LORE=null;
function syncLore(){
  if(!LORE) return;
  let filled=0;
  LORE.fields.forEach((f,i)=>{
    const val=(draft.lore[f.field]||"").trim();
    if(val) filled++;
    f.box.classList.toggle("done", !!val);
    if(f.req) f.req.hidden=!!val;
    LORE.pips[i].className=val?"on":"";
  });
  LORE.count.textContent=`${filled}/${DB.lorePacketFields.length}`;
}

        text:"This is the map that computes Reach. Edit it on the Factions screen."})
      ):el("div",{class:"muted"},
          el("b",{text:m.faction||"No faction assigned."}),
          el("div",{style:"margin-top:6px"},

                      : "Set a faction so the toolkit and window checks can run."))));

  const crew=crewByName(m.crew);
  const HELP={
    "Premise (one line)":{
      why:"The one-line pitch of this person as a mythologized figure. If you can't say it in a sentence, the card isn't a character yet.",
      eg:"The bartender who decides when your night ends."},
    "The True Detail":{
      why:"One real, specific, verifiable thing about the ACTUAL person. This is the anchor everything else hangs off, and the one field nobody but you can supply. Never invent it.",
      eg:"He closes down every bar. Always the last one out."},
    "The Myth":{
      why:"What the streets say happened. Exaggerated, unverifiable, better than the truth. This is where the True Detail becomes legend.",
      eg:"They say nobody has ever seen him leave a bar. The bar leaves first."},
    "Why This Faction":{
      why:"Faction is METHODOLOGY, not vibe. Being clever isn't Overthinker — winning BY being clever is. Say why this person wins this particular way.",
      eg:"He doesn't fight you. He makes the night cost you more than it cost him."},
    "Why This Crew":{
      why:"Who they run with and what they owe them. This is also the card's road: how does it advance the crew's plan DIFFERENTLY from the others?",
      eg:"Everyone at Shea's leaves worse than they came in. He's the one pouring."},
    "The Fall (printed weakness)":{
      why:"Their exposure to the faction's printed weakness. Required. A card with only the strength is a card wearing the colour, not a card of that faction.",
      eg:"Dragged into a fair fight before closing time, he's just a guy behind a bar."},
    "The Ascension (what the level-up MEANS)":{
      why:"What levelling up MEANS in the story — not the stat change. The base side should actively pursue this. If it merely happens to the card, the level-up isn't earned.",
      eg:"The bar is trashed and he loves it. Now he decides when everyone goes home."},
  };
  /* The lore packet is the only place in the rail you type into, and the old handler called
     touch(), which rebuilt the rail out from under the caret. Nothing in the rail depends on
     the lore text except the counter, the meter and each field's own done/REQUIRED state, so
     the fields are built once and those three are synced in place -- the same bargain
     buildProof/syncProof already strike for the artwork. Not rebuilding is also what keeps
     accented input working: tearing the textarea out mid-word cancels a dead-key or IME
     composition, and no amount of focus restoring gets that back. */
  const count=el("span",{class:"muted",style:"font-size:11px"});
  const pips=DB.lorePacketFields.map(()=>el("i",{}));
  const lore=el("div",{class:"railsec"},

      "Your working notes, not printed text. You write the card's flavour sentence FROM this — the one line of story inside the rules text. Fill it before you write the card."));

  LORE={count, pips, fields:[]};
  for(const f of DB.lorePacketFields){
    const help=HELP[f]||{};
    let ctx=null;
    if(f==="The Fall (printed weakness)" && brief && brief.weakness)
      ctx=`${m.faction} weakness: ${brief.weakness}`;
    if(f==="Why This Crew" && crew && crew.plan)
      ctx=`${crew.name} plan: ${crew.plan}`;
    if(f==="The Ascension (what the level-up MEANS)" && draft.levelupCondition)
      ctx=`Level-up condition: ${draft.levelupCondition.slice(0,150)}`;
    /* the badge is built for the two required fields and hidden once they are filled, rather
       than created and destroyed, so syncLore can toggle it without rebuilding the field */
    const req=(f==="The True Detail"||f==="The Fall (printed weakness)")
      ? el("span",{class:"req",text:"REQUIRED"}) : null;
    const box=el("div",{class:"lorefield"},
      el("div",{class:"hd"}, el("span",{class:"nm",text:f}), req),

      ctx?el("div",{class:"ctx",text:ctx}):null,
      el("textarea",{rows:"2","data-focus":"lore:"+f,placeholder:help.eg?`e.g. ${help.eg}`:"—",
        oninput:e=>{draft.lore[f]=e.target.value; markDirty(); syncLore();}}, draft.lore[f]||""));
    LORE.fields.push({field:f, box, req});
    lore.append(box);
  }
  rail.append(lore);
  syncLore();


}
