/* --------------------------------- JOBS ----------------------------------- */
/* A Job is what a Character does for its crew. A Role (keyword) is one of the tools it does
   it with. The rulebook already spends "Role" on faction-exclusive keywords, so these are
   deliberately different words for deliberately different things. */

const jobsAll     = () => DB.jobs || [];
const jobByKey    = k => jobsAll().find(j => j.key === k) || null;
const factionKey  = name => ((DB.factionData||[]).find(f => f.name === name) || {}).key || null;
const isExemptFac = name => !!((DB.factionData||[]).find(f => f.name === name) || {}).exempt;
const JOB_FAMILIES=[["front","Front"],["damage","Damage"],["support","Support"],
                    ["specialist","Specialist"]];

/* Can this faction hold this Job? null `factions` means any. */
function jobAllowed(job, facName){
  if(!job || !job.factions || !job.factions.length) return true;
  const k = factionKey(facName);
  return !k || job.factions.includes(k);
}

/* Does the card carry any of the Job's signature tools? Guidance, never law. */
function jobSignatureHit(job, meta){
  const sig = job && job.signature || {};
  const want = new Set([...(sig.keywords_any||[]), ...(sig.effects_any||[])]);
  if(!want.size) return null;                       // nothing mechanical to check
  const held = [ ...(meta.base?.keywords||[]), ...(meta.base?.effects||[]),
                 ...(meta.ascended?.keywords||[]), ...(meta.ascended?.effects||[]) ];
  return held.some(h => want.has(h));
}

function jobPanel(d){
  const m = d.meta;
  if(isExemptFac(m.faction)){
    return el("div",{class:"panel"},
      el("h3",{text:"Job"}),
      el("div",{class:"muted",style:"font-size:12px;margin-top:6px"},
        "Icons hold no Job and no Formation. They are one-person armies, not crew members, "+
        "and they are deliberately outside the consistency system."));
  }
  const job = jobByKey(m.job);
  const hit = job ? jobSignatureHit(job, m) : null;

  const picker = el("div",{class:"chips",style:"margin-top:6px"});
  picker.append(el("button",{class:"chip","aria-pressed":!m.job,
    onclick:()=>{ m.job=null; touch(); renderMain(); }},"— none —"));
  for(const [fam,label] of JOB_FAMILIES){
    const inFam = jobsAll().filter(j => j.family === fam);
    if(!inFam.length) continue;
    picker.append(tipped(el("span",{class:"famlabel",text:label}),"family:"+fam,{underline:false}));
    for(const j of inFam){
      const ok  = jobAllowed(j, m.faction);
      const bits=["chip"];
      if(!ok) bits.push("faded");
      if(j.status==="unbuilt") bits.push("faded");
      picker.append(el("button",{class:bits.join(" "),"aria-pressed":m.job===j.key,
        title: (!ok ? `${m.faction} may not hold this Job. ${j.faction_note||""}`
                    : j.status==="unbuilt" ? `No mechanics exist for this Job yet. ${j.unbuilt_reason||""}`
                    : j.identity||""),
        onclick:()=>{ m.job=j.key; touch(); renderMain(); }}, j.name));
    }
  }

  const body=[el("h3",{text:"Job — what this card does for its crew"}),
              el("div",{class:"muted",style:"font-size:11.5px;margin-top:3px"},
                "Not the same as a keyword. A keyword is a Role: one of the tools. The Job is the position."),
              picker];

  if(job){
    /* legality is a hard error — say so loudly and say why */
    if(!jobAllowed(job, m.faction)){
      body.push(el("div",{class:"stub"},
        el("span",{class:"glyph critical-bg",text:GLYPH.critical}),
        el("b",{text:` ${m.faction} cannot hold ${job.name}. `}),
        job.faction_note || `Restricted to ${job.factions.join(", ")}.`));
    }
    /* signature fit is guidance — a nudge, not a wall */
    if(hit === false){
      const sig=job.signature||{};
      const want=[...(sig.keywords_any||[]), ...(sig.effects_any||[])];
      body.push(el("div",{class:"stub"},
        el("span",{class:"glyph warning-bg",text:GLYPH.warning}),
        el("b",{text:` Doesn't look like a ${job.name} yet. `}),
        `A ${job.name} usually shows one of: ${want.slice(0,6).join(", ")}`+
        (want.length>6?"…":"")));
    }
    const line=(k,v)=> v ? el("div",{style:"margin-top:6px"},
      el("span",{class:"muted",style:"font-size:11px",text:k+" "}),
      el("span",{style:"font-size:12.5px",text:String(v).trim()})) : null;
    body.push(el("div",{style:"margin-top:10px;padding-top:10px;border-top:1px solid var(--gridline)"},
      line("The job", job.job),
      line("Beats", job.beats),
      line("Loses to", job.loses_to),
      line("The line", job.line),
      job.note ? line("Note", job.note) : null));
  }
  return el("div",{class:"panel"}, ...body.filter(Boolean));
}

/* ------------------------------ FORMATIONS -------------------------------- */
/* A Formation names four required Jobs and leaves one slot free. Four slots are
   near-mandatory; the fifth is where the crew says something about itself. */

function formationPanel(c, members){
  const forms = DB.formations || [];
  const f = forms.find(x => x.key === c.formation) || null;
  const eligible = members.filter(m => !isExemptFac(m.meta.faction));
  const held = new Map();                            // job key -> [card names]
  for(const m of eligible)
    if(m.meta.job) held.set(m.meta.job, [...(held.get(m.meta.job)||[]), m.meta.name]);

  const picker = el("div",{class:"chips",style:"margin-top:6px"});
  picker.append(el("button",{class:"chip","aria-pressed":!c.formation,
    onclick:()=>{ c.formation=null; renderMain(); }},"— not declared —"));
  for(const x of forms)
    picker.append(el("button",{class:"chip"+(x.coordination==="chaotic"?" faded":""),
      "aria-pressed":c.formation===x.key, title:x.plan,
      onclick:()=>{ c.formation=x.key;
                    c.coordination = x.coordination || c.coordination; renderMain(); }}, x.name));

  const body=[el("h3",{text:"Formation — the five-person structure"}),
              el("div",{class:"muted",style:"font-size:11.5px;margin-top:3px"},
                "Lore leads → the plan follows the lore → the Formation follows the plan. "+
                "Four required Jobs, one free slot."),
              picker];

  if(f){
    body.push(el("div",{style:"margin-top:12px;font-size:12.5px",text:f.plan.trim()}));

    if(f.rule === "no_internal_enablers"){
      body.push(el("div",{class:"stub"},
        el("b",{text:"This is not an exemption from validation — it is a different rule. "}),
        (f.rule_detail||"").trim()));
      body.push(el("div",{class:"muted",style:"font-size:11.5px;margin-top:8px",
        text:(f.compensation||"").trim()}));
    } else {
      const rows = el("div",{class:"grid",style:"margin-top:10px"});
      for(const key of f.required_jobs){
        const job = jobByKey(key) || {name:key};
        const who = held.get(key) || [];
        const ok  = who.length > 0;
        rows.append(el("div",{class:"row",style:"gap:8px;align-items:baseline"},
          el("span",{class:`glyph ${ok?"good":"warning"}-bg`,text:ok?GLYPH.good:GLYPH.warning}),
          el("b",{style:"font-size:12.5px",text:job.name}),
          el("span",{class:"muted",style:"font-size:12px",
            text: ok ? who.join(", ") : "nobody in this crew does this job"})));
      }
      /* the free slot, and whatever is sitting in it */
      const extra = [...held.keys()].filter(k => !f.required_jobs.includes(k));
      rows.append(el("div",{class:"row",style:"gap:8px;align-items:baseline;margin-top:6px;padding-top:8px;border-top:1px solid var(--gridline)"},
        el("span",{class:"glyph",style:"background:var(--baseline)",text:"·"}),
        el("b",{style:"font-size:12.5px",text:"Free slot"}),
        el("span",{class:"muted",style:"font-size:12px",
          text: extra.length ? extra.map(k=>(jobByKey(k)||{name:k}).name).join(", ")
                             : (f.free_slot||"").trim()})));
      body.push(rows);
      body.push(el("div",{class:"muted",style:"font-size:11.5px;margin-top:10px",
        text:`Loses to: ${(f.loses_to||"").trim()}`}));
    }
  }
  return el("div",{class:"panel"}, ...body.filter(Boolean));
}

          text:`${members.length} cards across ${new Set(members.map(m=>m.meta.faction)).size} factions · ${c.reviewed?"reviewed":"DRAFT"}`})),
      el("button",{class:"primary",onclick:save},"Save crew"))));

  main.append(el("div",{class:"panel"},
    el("h3",{text:"The plan — how does this crew win a game?"}),
    el("textarea",{rows:"3",oninput:e=>{c.plan=e.target.value;}},c.plan||""),
    el("label",{class:"fl",text:"Lore basis — why the plan follows from who they are"}),
    el("textarea",{rows:"3",oninput:e=>{c.lore_basis=e.target.value;}},c.lore_basis||""),
    el("label",{class:"fl",text:"Signature"}),
    el("textarea",{rows:"1",oninput:e=>{c.signature=e.target.value;}},c.signature||""),
    el("label",{class:"fl",text:"Coordination"}),
    el("div",{class:"chips"},
      ...["coordinated","chaotic"].map(k=>tipped(el("button",{class:"chip","aria-pressed":c.coordination===k,
        title:k==="chaotic"?"exempt from the single-plan rule, but chaos must be mechanically real":"",
        onclick:()=>{c.coordination=k; renderMain();}},k), k, {underline:false}))),
    el("label",{class:"win",style:"display:flex;gap:8px;margin-top:12px;cursor:pointer"},
      el("input",{type:"checkbox",checked:!!c.reviewed,onchange:e=>{c.reviewed=e.target.checked;}}),
      el("span",{},"I have reviewed this crew's plan"))));

  main.append(formationPanel(c, members));

  /* roads */
  const expr = c.expressions = c.expressions || [];
  const rows=el("div",{class:"grid"});
  const seen={};
  for(const m of members.sort((a,b)=>a.meta.name.localeCompare(b.meta.name))){
    const slug=m.meta.slug;
    let entry=expr.find(e=>e.card===slug);
    if(!entry){ entry={card:slug,road:""}; expr.push(entry); }
    const road=(entry.road||"").trim().toLowerCase();
    const dupe = road && seen[road];
    if(road) seen[road]=true;
    rows.append(el("div",{},
      el("label",{class:"fl"},
        el("span",{class:"dot",style:`display:inline-block;margin-right:6px;background:var(${FACTION_VAR[m.meta.faction]||"--baseline"})`}),
        m.meta.name, dupe?el("span",{class:"warning-c",text:"  · duplicate road"}):null),
      el("textarea",{rows:"2",placeholder:"the different road this card takes to the crew's plan",
        oninput:e=>{entry.road=e.target.value; renderMain();}},entry.road||"")));
  }
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Roads — every card must reach the plan a different way"}),
    el("div",{class:"muted",style:"font-size:11.5px;margin:4px 0 8px"},
      "If you can't write a distinct road for a card, that card is a duplicate."),
    rows));
}

function renderMatrix(main){
  const facs=(DB.factionData||[]).map(f=>f.name);
  const crewNames=[...new Set(cards.map(c=>c.meta.crew||"Unassigned"))].sort();
  main.append(el("div",{class:"topbar"},el("h2",{class:"screentitle",text:"Crew × Faction"}),
    el("div",{class:"muted",style:"font-size:12px",text:"click a card to open it · hatched = empty"})));
  const t=el("table",{class:"matrix"});
  t.append(el("thead",{},el("tr",{}, el("th",{class:"rowh",text:"Crew"}),
    ...facs.map(f=>el("th",{}, el("span",{class:"dot",style:`display:inline-block;margin-right:5px;background:var(${FACTION_VAR[f]||"--baseline"})`}), f)),
    el("th",{text:"total"}))));
  const tb=el("tbody",{});
  for(const crew of crewNames){
    const tr=el("tr",{});
    tr.append(el("td",{class:"rowh",text:crew}));
    let total=0;
    for(const f of facs){
      const list=cardsOf(f,crew==="Unassigned"?null:crew).filter(c=>(c.meta.crew||"Unassigned")===crew);
      total+=list.length;
      const cell=el("div",{class:`cell ${list.length?"":"empty"}`});
      for(const c of list){
        const sc=c.score;
        /* red = the BASE side is off. Nearly every card fails the ascended-side check today
           (OQ-04), so colouring on that would make the whole grid red and say nothing. */
        const over = sc.scorable && sc.baseSeverity && sc.baseSeverity!=="good";
        cell.append(el("button",{class:`mini ${over?"over":""}`,title:c.meta.name,
          onclick:()=>{ setMode("cards"); select(c); }},
          c.meta.name.split(",")[0]));
      }
      tr.append(el("td",{},cell));
    }
    tr.append(el("td",{style:"text-align:center;font-variant-numeric:tabular-nums;padding:8px",text:String(total)}));
    tb.append(tr);
  }
  const foot=el("tr",{});
  foot.append(el("td",{class:"rowh",text:"total"}));
  for(const f of facs) foot.append(el("td",{style:"text-align:center;padding:8px;font-variant-numeric:tabular-nums",
    text:String(cardsOf(f).length)}));
  foot.append(el("td",{style:"text-align:center;padding:8px;font-weight:600",text:String(cards.length)}));
  tb.append(foot);
  t.append(tb);
  main.append(el("div",{class:"panel"},t));
}

/* ------------------------------- HEALTH ---------------------------------- */
function renderHealth(main){
  main.append(el("div",{class:"topbar"},el("h2",{class:"screentitle",text:"Game health"})));
  const scorable=cards.filter(c=>c.score.scorable);
  /* base side only -- nearly every card fails the ascended-side check today (OQ-04), so the
     raw headroom number is 25/25 and tells you nothing actionable. */
  const over=scorable.filter(c=>c.score.baseSeverity!=="good");
  const legalDeck = cards.filter(c=>(c.meta.subtype||"")!=="Ascendant").length;
  main.append(el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px"},
    el("div",{class:"kpi"},el("div",{class:"v",text:String(cards.length)}),el("div",{class:"l",text:"cards"})),
    el("div",{class:`kpi`},el("div",{class:`v ${over.length?"critical-c":""}`,text:String(over.length)}),
      el("div",{class:"l",text:"base side off"})),
    el("div",{class:"kpi"},el("div",{class:`v ${legalDeck?"":"critical-c"}`,text:String(legalDeck)}),
      el("div",{class:"l",text:"non-Ascendants"})),
    el("div",{class:"kpi"},el("div",{class:"v",text:String((DB.findings||[]).filter(f=>f.severity==="error").length)}),el("div",{class:"l",text:"blocking"})),
    el("div",{class:"kpi"},el("div",{class:"v",text:String((DB.playtests||[]).length)}),el("div",{class:"l",text:"playtests"}))));

  /* window coverage */
  const wc=el("table",{class:"wingrid"},el("thead",{},el("tr",{},
    el("th",{text:"Window"}),...(DB.factionData||[]).map(f=>el("th",{text:f.name.slice(0,4)})),el("th",{text:"strong"}))));
  const wb=el("tbody",{});
  for(const w of DB.windowKeys){
    const tr=el("tr",{}); tr.append(el("td",{text:DB.windowLabels[w]}));
    let n=0;
    for(const f of DB.factionData||[]){
      const lvl=(f.windows||{})[w]||"blind";
      if(lvl==="strong") n++;
      tr.append(el("td",{}, el("span",{class:`lvl ${lvl}`,text:lvl[0].toUpperCase()})));
    }
    tr.append(el("td",{}, n<2?el("span",{class:"warning-c"},el("span",{class:"swatch warning-bg"}),String(n)):String(n)));
    wb.append(tr);
  }
  wc.append(wb);
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Window coverage — fewer than two strong is a gap"}),wc));

  /* job coverage -- which positions nobody in the pool plays. This is the design backlog. */
  const filled=new Map();
  for(const c of cards)
    if(c.meta.job && !isExemptFac(c.meta.faction))
      filled.set(c.meta.job,[...(filled.get(c.meta.job)||[]),c.meta.name]);
  const jt=el("table",{class:"wingrid"},el("thead",{},el("tr",{},
    el("th",{text:"Family"}),el("th",{text:"Filled"}),el("th",{text:"Empty — each one is a card waiting to be designed"}))));
  const jb=el("tbody",{});
  for(const [fam,label] of JOB_FAMILIES){
    const inFam=jobsAll().filter(j=>j.family===fam && j.status==="built");
    const yes=inFam.filter(j=>filled.has(j.key));
    const no =inFam.filter(j=>!filled.has(j.key));
    const tr=el("tr",{});
    tr.append(el("td",{text:label}));
    tr.append(el("td",{},
      el("span",{class:no.length?"":"good-c"},
        el("span",{class:`swatch ${no.length?(yes.length?"warning-bg":"critical-bg"):"good-bg"}`}),
        `${yes.length}/${inFam.length}`)));
    tr.append(el("td",{class:"muted",style:"font-size:12px",
      text: no.length ? no.map(j=>j.name).join(", ") : "—"}));
    jb.append(tr);
  }
  jt.append(jb);
  const parked=jobsAll().filter(j=>j.status==="unbuilt");
  main.append(el("div",{class:"panel"},
    el("h3",{
      text:"Job coverage — which positions nobody plays"}),jt,
    parked.length?el("div",{class:"muted",style:"font-size:11.5px;margin-top:10px"},
      el("b",{text:"Not yet expressible: "}),
      parked.map(j=>j.name).join(", "),
      " — these need a RULES change before a card can be designed, so they are listed, never flagged."):null));

  /* cost curve per faction */
  const costs=[...new Set(scorable.map(c=>c.meta.cost))].sort((a,b)=>a-b);
  const cc=el("table",{class:"wingrid"},el("thead",{},el("tr",{},
    el("th",{text:"Faction"}),...costs.map(c=>el("th",{text:String(c)})),el("th",{text:"total"}))));
  const cb=el("tbody",{});
  for(const f of DB.factionData||[]){
    const tr=el("tr",{}); tr.append(el("td",{text:f.name}));
    let tot=0;
    for(const cost of costs){
      const n=scorable.filter(c=>c.meta.faction===f.name&&c.meta.cost===cost).length;
      tot+=n;
      tr.append(el("td",{class:n?"":"muted",text:n?String(n):"·"}));
    }
    tr.append(el("td",{text:String(tot)})); cb.append(tr);
  }
  cc.append(cb);
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Cost curve by faction"}),cc));

  /* budget share */
  const bs=el("div",{class:"grid"});
  for(const f of DB.factionData||[]){
    const mine=scorable.filter(c=>c.meta.faction===f.name);
    const st=mine.reduce((a,c)=>a+c.score.statsTotal,0);
    const ef=mine.reduce((a,c)=>a+c.score.baseEffectPoints,0);
    const kw=mine.reduce((a,c)=>a+c.score.baseKeywordPoints,0);
    const tot=Math.max(1,st+ef+kw);
    bs.append(el("div",{},
      el("div",{class:"row spread",style:"font-size:12px;margin-bottom:4px"},
        el("span",{},f.name),
        el("span",{class:"muted",text:`stats ${Math.round(st/tot*100)}% · effects ${Math.round(ef/tot*100)}% · keywords ${Math.round(kw/tot*100)}%`})),
      /* a tonal ramp, not three hues: raw numbers are dim, ideas brighten */
      el("div",{class:"bar"},
        el("i",{style:`width:${st/tot*100}%;background:var(--edge)`,title:"stats"}),
        el("i",{style:`width:${ef/tot*100}%;background:var(--pencil)`,title:"effects"}),
        el("i",{style:`width:${kw/tot*100}%;background:var(--key)`,title:"keywords"}))));
  }
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Where each faction spends its points"}),bs,
    el("div",{class:"muted",style:"font-size:11.5px;margin-top:9px"},
      "The bar runs dim to bright: stats, then effects, then keywords. A faction whose bar "+
      "never brightens is a faction made of numbers rather than ideas.")));

  /* deck feasibility */
  const need={Descendant:24,Tactic:8,Attachment:3,Ascendant:5};
  const have={}; for(const c of cards) have[c.meta.subtype]=(have[c.meta.subtype]||0)+1;
  const df=el("table",{class:"wingrid"},el("thead",{},el("tr",{},
    el("th",{text:"Card type"}),el("th",{text:"have"}),el("th",{text:"a 40-card deck wants"}),el("th",{text:""}))));
  const dfb=el("tbody",{});
  for(const [k,v] of Object.entries(need)){
    const h=have[k]||0;
    dfb.append(el("tr",{},el("td",{text:k}),el("td",{text:String(h)}),el("td",{text:String(v)}),
      el("td",{}, h>=v?el("span",{class:"good-c"},el("span",{class:"swatch good-bg"}),"ok")
                     :el("span",{class:"critical-c"},el("span",{class:"swatch critical-bg"}),`short ${v-h}`))));
  }
  df.append(dfb);
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Can a legal deck be built from this pool?"}),df));

  /* ---- playtest log: the only data the documents cannot produce ---- */
  const draft={when:"",players:"",winner:"",cards:"",felt_bad:"",notes:""};
  const field=(k,ph,rows=1)=>el("div",{},
    el("label",{class:"fl",text:k.replace("_"," ")}),
    el("textarea",{rows:String(rows),placeholder:ph,oninput:e=>{draft[k]=e.target.value;}}));
  const log=el("div",{class:"listpane",style:"margin-top:var(--s3)"});
  for(const g of [...(DB.playtests||[])].reverse()){
    log.append(el("div",{class:"finding warn"},
      el("span",{class:"code",text:"#"+g.id}),
      el("div",{class:"body"},
        el("div",{}, el("span",{class:"sub",text:g.when||"undated"}), " — ", g.players||"", 
          g.winner?el("span",{class:"muted",text:`  ·  won: ${g.winner}`}):null),
        g.felt_bad?el("div",{class:"fx",style:"color:var(--warning)",text:"felt bad: "+g.felt_bad}):null,
        g.notes?el("div",{class:"fx",text:g.notes}):null)));
  }
  main.append(el("div",{class:"panel"},
    el("div",{class:"row spread",style:"margin-bottom:6px"},
      el("h3",{text:`Playtest log · ${(DB.playtests||[]).length} games`}),
      el("span",{class:"muted",style:"font-size:11.5px",
        text:"\"what felt bad\" is the field that matters — nothing else can tell you it"})),
    el("div",{class:"grid2"},
      el("div",{}, field("when","2026-08-05"), field("players","me vs Dre deck"),
                   field("winner","who won")),
      el("div",{}, field("cards","cards involved, comma separated"),
                   field("felt_bad","what felt unfair or unanswerable?",2))),
    field("notes","anything else",2),
    el("div",{class:"row",style:"margin-top:10px;gap:8px"},
      el("button",{class:"primary",onclick:async()=>{
        const r=await fetch("/api/playtest",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify(draft)});
        const j=await r.json();
        if(j.error) return toast("Failed: "+j.error,6000);
        DB.playtests=j.playtests; toast("Game logged"); renderMain();
      }},"Log this game"))));
  if((DB.playtests||[]).length) main.append(log);

  /* ---- snapshots ---- */
  let label="";
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Snapshots"}),
    el("div",{class:"muted",style:"font-size:11.5px;margin:4px 0 8px"},
      "Tag the pool before a playtest so you can tell what changed afterwards. Playtest feedback is worthless if you can't remember which version you played."),
    el("div",{class:"row",style:"gap:8px"},
      el("input",{class:"efsearch",style:"flex:1;margin:0",placeholder:"before playtest 3",
        oninput:e=>{label=e.target.value;}}),
      el("button",{class:"ghost",onclick:async()=>{
        const r=await fetch("/api/snapshot",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({label})});
        const j=await r.json();
        toast(j.error ? "Failed: "+j.error : `Snapshot "${j.label}" — ${j.cards} cards`);
      }},"Take snapshot"))));
}

let probFilter="";

  const all=DB.findings||[];
  const codes=[...new Set(all.map(f=>f.code))].sort();
  main.append(el("div",{class:"topbar"},
    el("div",{class:"row spread"},
      el("div",{},el("h2",{class:"screentitle",text:"Problems"}),

      el("button",{class:"ghost",onclick:async()=>{await refreshFindings(); renderMain(); toast("re-checked");}},"Re-check"))));
  const chips=el("div",{class:"chips",style:"margin-bottom:12px"});
  chips.append(el("button",{class:"chip","aria-pressed":!probFilter,onclick:()=>{probFilter="";renderMain();}},"all"));
  for(const c of codes) chips.append(tipped(el("button",{class:"chip","aria-pressed":probFilter===c,
    onclick:()=>{probFilter=c;renderMain();}}, c,

  main.append(chips);
  const list=el("div",{class:"listpane"});
  for(const f of all.filter(f=>!probFilter||f.code===probFilter)){
    list.append(el("div",{class:`finding ${f.severity==="error"?"err":"warn"}`},
      tipped(el("span",{class:"code",text:f.code}), f.code, {underline:false}),
      el("div",{class:"body"},
        el("div",{}, el("span",{class:"sub",text:f.subject}), ": ", f.message),
        f.fix?el("div",{class:"fx",text:"fix: "+f.fix}):null,
        f.where?el("div",{class:"fx",text:f.where}):null),
      cards.find(c=>c.meta.name===f.subject)
        ? el("button",{class:"ghost",style:"padding:3px 9px;font-size:11.5px",
            onclick:()=>{setMode("cards"); select(cards.find(c=>c.meta.name===f.subject));}},"open")
        : null));
  }
  main.append(list);
}

function renderMain(){
  const main=$("#main"); main.replaceChildren();
  if(MODE==="library")  return renderLibrary(main);
  if(MODE==="factions") return renderFactions(main);
  if(MODE==="crews")    return renderCrews(main);
  if(MODE==="matrix")   return renderMatrix(main);
  if(MODE==="health")   return renderHealth(main);
  if(MODE==="problems") return renderProblems(main);
  if(!current){ main.append(el("div",{class:"muted",style:"padding:40px 0",text:"Select a card."})); return; }
  const m=draft.meta, s=scoreDraft(draft);

  main.append(el("div",{class:"topbar cardhead"},
    el("div",{class:"row spread"},
      el("div",{style:"min-width:0"},
        el("h2",{text:m.name}),
        el("div",{class:"meta"},
          factionChip(m.faction),
          crewChip(m.crew),
          glossaryFor(m.subtype) ? term(m.subtype) : el("span",{},m.subtype||"—"),
          el("span",{class:"path",text:draft.relPath}))),
      el("div",{class:"row",style:"gap:6px"},
        el("select",{"aria-label":"card status",
          onchange:e=>{ m.status=e.target.value; touch(); }},
          ...["draft","ported","reviewed","playtested","final","retired"].map(v=>
            el("option",{value:v,selected:(m.status||"draft")===v,
              title:(GLOSSARY[v]||["",""])[1]},v)))))));

  main.append(proofPanel(s));

  /* Order follows the job: the dials you turn first, then the two verdicts that say
     whether the card can be printed, then its content, then its context. Cost & stats
     used to sit fifth, below three read-only panels -- it is the control you reach for
     the moment the proof says the number is wrong. */
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Cost & stats"}),
    el("div",{class:"grid stats",style:"margin-top:var(--s3)"},
      stepper("Cost", m.cost, v=>{m.cost=v; touch();}, 0),
      ...DB.statKeys.map(k=>stepper(k, m.stats?.[k],
        v=>{m.stats=m.stats||{}; m.stats[k]=v; touch();})))));

  main.append(gateStrip());
  if(s.scorable) main.append(scorePanel(s));

  /* The printed words live in the proof now, beside the face and the budget. What is left
     here is the priced mechanics -- the things that actually move the meters. */
  main.append(el("div",{class:"panel"},
    el("h3",{text:"Base side — priced mechanics"}),
    el("label",{class:"fl"},"Keywords — ",m.faction||"?"," only (",term("G4"),")"), keywordChips("base"),
    el("label",{class:"fl",text:"Effect types"}), effectPicker("base")));

  main.append(el("div",{class:"panel"},
    el("h3",{text:"Level-up side — priced mechanics"}),
    el("label",{class:"fl",text:"Keywords gained"}), keywordChips("ascended"),
    el("label",{class:"fl",text:"Effect types"}), effectPicker("ascended")));

  main.append(jobPanel(draft));
  main.append(siblingTable());

  /* playtests involving this card */
  const games=(DB.playtests||[]).filter(g=>
    (g.cards||"").toLowerCase().includes((m.name||"").split(",")[0].toLowerCase()));
  if(games.length){
    const log=el("div",{});
    for(const g of games.reverse())
      log.append(el("div",{class:"gate"},
        el("span",{class:"gid",text:"#"+g.id}),
        el("span",{class:"msg"}, g.when||"undated",
          g.felt_bad?el("span",{class:"warning-c",text:"  · felt bad: "+g.felt_bad}):null)));
    main.append(el("div",{class:"panel"},
      el("h3",{text:`Playtests involving this card · ${games.length}`}), log));
  }
}

      el("div",{class:"weakness",text:brief.weakness}),
      el("div",{class:"muted",style:"font-size:11.5px;margin-top:8px",
        text:"Gameplay D1 and lore D4 both score 5 only if the card is exposed to this weakness, not just the strength."}),
      el("h3",{style:"margin-top:18px",text:"Where they can answer a plan"}), wins,
      el("div",{class:"muted",style:"font-size:11.5px;margin-top:6px",
        text:"This is the map that computes Reach. Edit it on the Factions screen."})
      ):el("div",{class:"muted"},
          el("b",{text:m.faction||"No faction assigned."}),
          el("div",{style:"margin-top:6px"},
            m.faction ? `"${m.faction}" is not in data/factions.yaml — check the spelling, or add it on the Factions screen.`
                      : "Set a faction so the toolkit and window checks can run."))));

  const crew=crewByName(m.crew);
  const HELP={
    "Premise (one line)":{
      why:"The one-line pitch of this person as a mythologized figure. If you can't say it in a sentence, the card isn't a character yet.",
      eg:"The bartender who decides when your night ends."},
    "The True Detail":{
      why:"One real, specific, verifiable thing about the ACTUAL person. This is the anchor everything else hangs off, and the one field nobody but you can supply. Never invent it.",
      eg:"He closes down every bar. Always the last one out."},
    "The Myth":{
      why:"What the streets say happened. Exaggerated, unverifiable, better than the truth. This is where the True Detail becomes legend.",
      eg:"They say nobody has ever seen him leave a bar. The bar leaves first."},
    "Why This Faction":{
      why:"Faction is METHODOLOGY, not vibe. Being clever isn't Overthinker — winning BY being clever is. Say why this person wins this particular way.",
      eg:"He doesn't fight you. He makes the night cost you more than it cost him."},
    "Why This Crew":{
      why:"Who they run with and what they owe them. This is also the card's road: how does it advance the crew's plan DIFFERENTLY from the others?",
      eg:"Everyone at Shea's leaves worse than they came in. He's the one pouring."},
    "The Fall (printed weakness)":{
      why:"Their exposure to the faction's printed weakness. Required. A card with only the strength is a card wearing the colour, not a card of that faction.",
      eg:"Dragged into a fair fight before closing time, he's just a guy behind a bar."},
    "The Ascension (what the level-up MEANS)":{
      why:"What levelling up MEANS in the story — not the stat change. The base side should actively pursue this. If it merely happens to the card, the level-up isn't earned.",
      eg:"The bar is trashed and he loves it. Now he decides when everyone goes home."},
  };
  const filled = DB.lorePacketFields.filter(f=>(draft.lore[f]||"").trim()).length;
  const lore=el("div",{class:"railsec"},
    el("div",{class:"row spread"},
      el("h3",{text:"Lore packet"}),
      el("span",{class:"muted",style:"font-size:11px",text:`${filled}/${DB.lorePacketFields.length}`})),
    el("div",{class:"loremeter"},
      ...DB.lorePacketFields.map(f=>el("i",{class:(draft.lore[f]||"").trim()?"on":""}))),
    el("div",{class:"muted",style:"font-size:11.5px;margin-bottom:12px"},
      "Your working notes, not printed text. You write the card's flavour sentence FROM this — the one line of story inside the rules text. Fill it before you write the card."));

  for(const f of DB.lorePacketFields){
    const help=HELP[f]||{};
    const val=(draft.lore[f]||"").trim();
    let ctx=null;
    if(f==="The Fall (printed weakness)" && brief && brief.weakness)
      ctx=`${m.faction} weakness: ${brief.weakness}`;
    if(f==="Why This Crew" && crew && crew.plan)
      ctx=`${crew.name} plan: ${crew.plan}`;
    if(f==="The Ascension (what the level-up MEANS)" && draft.levelupCondition)
      ctx=`Level-up condition: ${draft.levelupCondition.slice(0,150)}`;
    lore.append(el("div",{class:`lorefield ${val?"done":""}`},
      el("div",{class:"hd"},
        el("span",{class:"nm",text:f}),
        (!val && (f==="The True Detail"||f==="The Fall (printed weakness)"))
          ? el("span",{class:"req",text:"REQUIRED"}) : null),
      el("div",{class:"why",text:help.why||""}),
      ctx?el("div",{class:"ctx",text:ctx}):null,
      el("textarea",{rows:"2",placeholder:help.eg?`e.g. ${help.eg}`:"—",
        oninput:e=>{draft.lore[f]=e.target.value; touch(false);}}, draft.lore[f]||"")));
  }
  rail.append(lore);


}

/* ---------------- state ---------------------------------------------------------------- */
let dirty=false;
function touch(rerender=true){
  dirty=true; $("#savebar").hidden=false;
  if(rerender){ renderMain(); }
  renderRail(); renderList();
}
function select(c,{force=false}={}){
  /* force skips the guard: Revert IS the discard action, so prompting is redundant. */
  if(!force && dirty && !confirm("Discard unsaved changes to this card?")) return;
  current=c; draft=structuredClone(c);
  draft.meta.base=draft.meta.base||{keywords:[],effects:[]};
  draft.meta.ascended=draft.meta.ascended||{keywords:[],effects:[]};
  draft.meta.base.keywords??=[]; draft.meta.base.effects??=[];
  draft.meta.ascended.keywords??=[]; draft.meta.ascended.effects??=[];
  dirty=false; $("#savebar").hidden=true;
  renderArt(); renderMain(); renderRail(); renderList();
}
function toast(msg,ms=2600){const t=$("#toast");t.textContent=msg;t.hidden=false;
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms);}

async function save(){
  const btn=$("#save"); btn.disabled=true; btn.textContent="Saving…";
  try{
    const res=await fetch("/api/card",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({relPath:draft.relPath, meta:draft.meta, rulesText:draft.rulesText,
        levelupCondition:draft.levelupCondition, ascendedText:draft.ascendedText, lore:draft.lore})});
    const saved=await res.json();
    if(!res.ok) throw new Error(saved.error||res.statusText);
    const i=cards.indexOf(current);
    cards[i]=saved; current=saved; draft=structuredClone(saved);
    dirty=false; $("#savebar").hidden=true;
    renderArt();
    /* reconcile the browser's arithmetic against the server's */
    const local=scoreDraft(draft);
    const drift = local.scorable && saved.score.scorable && local.baseDelta!==saved.score.baseDelta;
    toast(drift ? "Saved — but the server scored it differently. Run tools/balance.py."
                : `Saved to ${saved.relPath}`);
    refreshFindings();
    renderMain(); renderRail(); renderList();
  }catch(e){ toast("Save failed: "+e.message, 6000); }
  finally{ btn.disabled=false; btn.textContent="Save to file"; }
}

/* ---------------- boot ------------------------------------------------------------------ */
(async function(){
  try{
    const res=await fetch("/api/bootstrap");
    DB=await res.json();
    if(DB.error) throw new Error(DB.error);
  }catch(e){ $("#main").replaceChildren(el("div",{class:"stub",text:"Could not load card data: "+e.message})); return; }

  DB.kwPts=Object.fromEntries(DB.keywords.map(k=>[k.name,k.points]));
  DB.kwFaction=Object.fromEntries(DB.keywords.map(k=>[k.name,k.faction]));
  DB.efPts=Object.fromEntries(DB.effects.map(e=>[e.name,e.points]));
  cards=DB.cards;

  const sel=$("#ffac");
  for(const f of [...new Set(cards.map(c=>c.meta.faction).filter(Boolean))].sort())
    sel.append(el("option",{value:f,text:f}));
  for(const id of ["q","ffac","fbal"]) $("#"+id).addEventListener("input",renderList);

  $("#theme").addEventListener("click",()=>{
    const r=document.documentElement;
    r.dataset.theme = r.dataset.theme==="dark" ? "light" : "dark";
  });
  $("#lightbox").addEventListener("click",()=>{ $("#lightbox").hidden=true; });
  $("#newcard").addEventListener("click",newCardDialog);
  $("#clonecard").addEventListener("click",cloneCurrent);
  $("#save").addEventListener("click",save);
  $("#revert").addEventListener("click",()=>{ if(current) select(current,{force:true}); });
  addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==="s"){ e.preventDefault(); if(dirty) save(); }
    if(e.key==="Escape") $("#lightbox").hidden=true;
  });
  addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

  initTips();
  renderModes();
  renderList();
  if(cards.length) select(cards[0]);
})();
</script>
