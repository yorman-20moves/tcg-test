let dirty=false;
function markDirty(){ dirty=true; $("#savebar").hidden=false; }
function touch(rerender=true){
  markDirty();
  if(rerender){ renderMain(); }
  renderRail(); renderList();
}
function select(c,{force=false}={}){
  /* force skips the guard: Revert IS the discard action, so prompting is redundant. */
  if(!force && dirty && !confirm("Discard unsaved changes to this card?")) return;
  current=c; draft=structuredClone(c);
  draft.meta.base=draft.meta.base||{keywords:[],effects:[]};
  draft.meta.ascended=draft.meta.ascended||{keywords:[],effects:[]};
  draft.meta.base.keywords??=[]; draft.meta.base.effects??=[];
  draft.meta.ascended.keywords??=[]; draft.meta.ascended.effects??=[];
  dirty=false; $("#savebar").hidden=true;
  renderArt(); renderMain(); renderRail(); renderList();
  /* select() opens a different card -- it is not a redraw of this one, the way an edited field
     or a ticked window is. preservingFocus's scroll memory exists for redraws of the same
     thing; carrying it across to a different card would just be handing the new card whatever
     offset the old one happened to be scrolled to, which describes nothing about the new card.
     So both panes start at the top, same as opening the tool fresh. */
  [$("#main"),$("#rail")].filter(Boolean).forEach(p=>p.scrollTop=0);
}
function toast(msg,ms=2600){const t=$("#toast");t.textContent=msg;t.hidden=false;
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms);}

async function save(){
  const btn=$("#save"); btn.disabled=true; btn.textContent="Saving…";
  try{
    const res=await fetch("/api/card",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({relPath:draft.relPath, meta:draft.meta, rulesText:draft.rulesText,
        levelupCondition:draft.levelupCondition, ascendedText:draft.ascendedText, lore:draft.lore})});
    const saved=await res.json();
    if(!res.ok) throw new Error(saved.error||res.statusText);
    const i=cards.indexOf(current);
    cards[i]=saved; current=saved; draft=structuredClone(saved);
    dirty=false; $("#savebar").hidden=true;
    renderArt();
    /* reconcile the browser's arithmetic against the server's -- all three numbers that decide
       whether the card can be printed, not just the base delta */
    const local=scoreDraft(draft), lp=scorePlan(local, draft.meta.plan||{});
    const drift = local.scorable && saved.score.scorable &&
      (local.baseDelta!==saved.score.baseDelta || lp.reach!==saved.score.reach
       || lp.ceiling!==saved.score.ceiling);
    toast(drift ? "Saved — but the server scored it differently. Run tools/balance.py."
                : `Saved to ${saved.relPath}`);
    refreshFindings();
    renderMain(); renderRail(); renderList();
  }catch(e){ toast("Save failed: "+e.message, 6000); }
  finally{ btn.disabled=false; btn.textContent="Save to file"; }
}

/* ---------------- boot ------------------------------------------------------------------ */
(async function(){
  try{
    const res=await fetch("/api/bootstrap");
    DB=await res.json();
    if(DB.error) throw new Error(DB.error);
  }catch(e){ $("#main").replaceChildren(el("div",{class:"stub",text:"Could not load card data: "+e.message})); return; }

  DB.kwPts=Object.fromEntries(DB.keywords.map(k=>[k.name,k.points]));
  DB.kwFaction=Object.fromEntries(DB.keywords.map(k=>[k.name,k.faction]));
  DB.efPts=Object.fromEntries(DB.effects.map(e=>[e.name,e.points]));
  cards=DB.cards;

  const sel=$("#ffac");
  for(const f of [...new Set(cards.map(c=>c.meta.faction).filter(Boolean))].sort())
    sel.append(el("option",{value:f,text:f}));
  for(const id of ["q","ffac","fbal"]) $("#"+id).addEventListener("input",renderList);

  $("#theme").addEventListener("click",()=>{
    const r=document.documentElement;
    r.dataset.theme = r.dataset.theme==="dark" ? "light" : "dark";
  });
  $("#lightbox").addEventListener("click",()=>{ $("#lightbox").hidden=true; });
  $("#newcard").addEventListener("click",newCardDialog);
  $("#clonecard").addEventListener("click",cloneCurrent);
  $("#save").addEventListener("click",save);
  $("#revert").addEventListener("click",()=>{ if(current) select(current,{force:true}); });
  addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==="s"){ e.preventDefault(); if(dirty) save(); }
    if(e.key==="Escape") $("#lightbox").hidden=true;
  });
  addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

  initTips();
  renderModes();
  renderList();
  if(cards.length) select(cards[0]);

  /* Silent when the browser and the server agree, which is the normal case. A drift here means
     one of the two is lying about whether a card can be printed, and you should trust check.py. */
  const drift=parityCheck();
  if(drift.length){
    const first=drift[0];
    console.warn("score parity", drift);
    toast(`Scoring drift: ${first.name} ${first.field} — studio ${first.js}, server ${first.py}. `
          +`${drift.length} in total; see the console.`, 9000);
  }
})();
</script>
