<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Studio</title>
<style>
/* ============================================================================
   CARD STUDIO — built on the 20 Moves design system (dark cinematic).

   Tokens map 1:1 onto 20 Moves' names, so anything learned here transfers to
   the site: --color-bg, --color-ink, --color-orange, --color-cyan, Anton /
   Inter / IBM Plex Mono, the 8px spacing base, the chip/btn/card radii, the
   dot-grid field. The faces are self-hosted from tools/fonts/ rather than the
   CDN the system's stylesheet uses -- a local workbench should not need the
   internet to look like itself.

   ONE STUDIO-SPECIFIC RULE. The four factions already own red, blue, green and
   gold, so there is no hue left for status. Two channels, kept strictly apart:

     HUE   belongs to FACTION only.  A solid ink band or a dot.
           Never text, never a meter fill.
     FILL  belongs to STATUS only.   Meter fill, numerals, pill outlines.
           Never a band, never a dot.

   Status runs the system's own orange as an escalating ramp -- quiet ink, dim
   orange, orange, hot -- so "in tolerance" is simply clean and only OVER gets
   to raise its voice. Every status ships a glyph and a word too, so colour is
   never carrying the meaning alone.
   ========================================================================= */
@font-face{font-family:Anton;src:url(/fonts/Anton-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(/fonts/Inter-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(/fonts/IBMPlexMono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(/fonts/IBMPlexMono-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(/fonts/IBMPlexMono-600.woff2) format('woff2');font-weight:600;font-display:swap}

:root{
  color-scheme:dark;

  /* COLOR — 20 Moves */
  --color-bg:#080808; --color-bg-raised:#111111; --color-bg-band:#0b0b0b;
  --color-bg-card:rgba(255,255,255,.046); --color-bg-card-hover:rgba(255,255,255,.072);
  --color-bg-input:rgba(255,255,255,.028);
  --color-orange:#f27127; --color-orange-hover:#f5843f; --color-orange-press:#d95f1c;
  --color-cyan:#1fb6e8; --color-cyan-hover:#3fc4f0;
  --color-ink:#f2eee4; --color-ink-80:rgba(242,238,228,.80);
  --color-ink-60:rgba(242,238,228,.60); --color-ink-40:rgba(242,238,228,.40);
  --color-border:rgba(242,238,228,.13); --color-border-med:rgba(242,238,228,.22);
  --color-orange-glow:rgba(242,113,39,.35); --color-cyan-glow:rgba(31,182,232,.30);
  --color-orange-tint:rgba(242,113,39,.10); --color-cyan-tint:rgba(31,182,232,.09);
  --color-overlay:rgba(8,8,8,.88);

  /* studio roles, expressed in system tokens */
  --press:var(--color-bg); --bench:var(--color-bg-raised); --band:var(--color-bg-band);
  --well:var(--color-bg-card); --lift:var(--color-bg-card-hover);
  --key:var(--color-ink); --pencil:var(--color-ink-80); --ghost:var(--color-ink-60);
  --faint:var(--color-ink-40);
  --rule:var(--color-border); --edge:var(--color-border-med);
  --gridline:var(--color-border); --baseline:var(--color-border-med);

  /* faction inks — hue channel. Held clear of the system's cyan and orange so a
     faction band can never be mistaken for a UI accent or an alarm. */
  --f-warmongers:#e23b3b; --f-overthinkers:#5570e8; --f-assholes:#3fa757; --f-icons:#e8c233;

  /* status ramp — fill channel. Neutral, then the system orange escalating. */
  --good:var(--color-ink-60); --warning:#c08a3e;
  --serious:var(--color-orange); --critical:#ff4d3d;

  --shadow:0 12px 40px rgba(0,0,0,.45);

  --display:Anton,Impact,"Arial Narrow",sans-serif;
  --text:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --data:"IBM Plex Mono","Cascadia Mono",Consolas,ui-monospace,monospace;

  /* SIZE — 8px base, and the system's radii */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --radius-chip:3px; --radius-btn:6px; --radius-card:12px; --radius-pill:999px;
  --roster:268px; --rail:352px; --bench-max:1180px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --color-bg:#f4f2ec; --color-bg-raised:#fbfaf7; --color-bg-band:#efece5;
  --color-bg-card:rgba(16,14,10,.035); --color-bg-card-hover:rgba(16,14,10,.06);
  --color-bg-input:rgba(16,14,10,.02);
  --color-orange:#ba4805; --color-cyan:#0e6f92;
  --color-ink:#14120e; --color-ink-80:rgba(20,18,14,.80);
  --color-ink-60:rgba(20,18,14,.62); --color-ink-40:rgba(20,18,14,.42);
  --color-border:rgba(20,18,14,.14); --color-border-med:rgba(20,18,14,.26);
  --color-orange-glow:rgba(186,72,5,.28); --color-cyan-glow:rgba(14,111,146,.26);
  --color-orange-tint:rgba(186,72,5,.09); --color-cyan-tint:rgba(14,111,146,.08);
  --color-overlay:rgba(244,242,236,.90);
  --f-warmongers:#b52a2a; --f-overthinkers:#3a4fc0; --f-assholes:#227a38; --f-icons:#8a6b00;
  --warning:#8a5a13; --critical:#c22a1c;
  --shadow:0 12px 34px rgba(40,32,20,.20);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--color-bg); color:var(--color-ink);
  font:14px/1.55 var(--text);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
a{color:var(--color-cyan);text-decoration:none}
a:hover{color:var(--color-cyan-hover)}
::selection{background:var(--color-orange);color:var(--color-bg)}
:focus-visible{outline:3px solid var(--color-cyan-glow);outline-offset:2px;border-radius:var(--radius-chip)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--color-border-med);border-radius:var(--radius-pill);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--color-ink-40);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* the system's field of analysis, behind everything */
#dotgrid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(var(--color-border) 1px,transparent 1px);
  background-size:32px 32px;opacity:.5;
}

/* The system's eyebrow: IBM Plex Mono, tracked, uppercase. Every label in this
   tool is one, which is the single repeated gesture that ties the bench together. */
.slug,.herolabel,.crewgroup,label.fl,.railsec h3,.stepper .lb,.kpi .l,.famlabel,.sib th{
  font-family:var(--data); font-size:11px; font-weight:500; letter-spacing:.18em;
  text-transform:uppercase; color:var(--color-ink-60);
}
.num,.cost,.pts,.pt,.kpi .v,.stepper input,.credit input,
.sib td,.matrix .tot,.scorebar b,.meter .cap b,.breakdown b,.mode .n{
  font-family:var(--data); font-variant-numeric:tabular-nums;
}
.muted{color:var(--ghost)}
.sec{color:var(--pencil)}
.row{display:flex;align-items:center;gap:var(--s2)}
.spread{justify-content:space-between}

/* ---------- masthead ------------------------------------------------------
   The nav used to live inside the card list, which made a seven-screen tool
   read as a file browser with tabs bolted on. It is a masthead now. */
#app{
  display:grid;
  grid-template-columns:var(--roster) minmax(440px,1fr) var(--rail);
  grid-template-rows:52px 1fr; height:100vh;
}
#masthead{
  grid-column:1/-1; display:flex; align-items:center; gap:var(--s4);
  padding:0 var(--s4) 0 var(--s3); background:var(--bench);
  border-bottom:1px solid var(--rule); position:relative; z-index:40;
}
.wordmark{display:flex;align-items:center;gap:10px;flex:none}
/* the mark is the game's own palette used as a printer's colour control strip */
.colorbar{display:flex;gap:2px;flex:none}
.colorbar i{width:5px;height:19px;border-radius:1px;display:block}
.wordmark b{
  font-family:var(--display);font-size:20px;font-weight:400;letter-spacing:.04em;
  text-transform:uppercase;color:var(--color-ink);
}
#modes{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
.mode{
  font-family:var(--text);font-size:13px;font-weight:500;letter-spacing:.01em;
  color:var(--color-ink-60);background:none;border:0;cursor:pointer;
  padding:0 13px;height:52px;position:relative;white-space:nowrap;
}
.mode:hover{color:var(--color-ink)}
.mode[aria-current="true"]{color:var(--key)}
/* the active screen is marked by an ink line at the foot of the masthead */
.mode[aria-current="true"]::after{
  content:"";position:absolute;left:6px;right:6px;bottom:0;height:2px;background:var(--color-cyan);
}
.mode .n{font-family:var(--data);font-size:10.5px;color:var(--color-ink-60);margin-left:6px}
.mode.bad .n{color:var(--critical);font-weight:700}
.mastright{display:flex;align-items:center;gap:var(--s3);flex:none;font-size:11.5px}
.iconbtn{
  width:28px;height:28px;border-radius:var(--radius-btn);border:1px solid var(--rule);background:none;
  cursor:pointer;color:var(--pencil);display:grid;place-items:center;line-height:1;flex:none;
}
.iconbtn:hover{color:var(--key);border-color:var(--edge)}

/* ---------- columns ---------- */
.col{overflow-y:auto;min-height:0}
#list{background:var(--bench);border-right:1px solid var(--rule);display:flex;flex-direction:column;
  position:relative;z-index:2}
#rail{background:var(--bench);border-left:1px solid var(--rule);position:relative;z-index:2}
/* On a 2000px monitor every table used to stretch the full width, which put the
   first column and the last one a foot apart. The system caps a reading column at
   1240px; the bench holds to that and lets the surplus become margin. */
#main{padding:0 var(--s5) 140px;position:relative;z-index:1}
#main>*{max-width:var(--bench-max)}
#main>.topbar{max-width:none;padding-right:var(--s5)}
#main>.topbar>*{max-width:var(--bench-max)}
@media(max-width:1240px){
  #app{grid-template-columns:var(--roster) 1fr}
  #rail{display:none}
}
@media(max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}
  #list{border-right:0;border-bottom:1px solid var(--rule);max-height:38vh}
  #main{padding:0 var(--s3) 140px}
}

/* ---------- roster ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bench);
  border-bottom:1px solid var(--rule);padding:var(--s3);
}
#main .topbar{
  background:var(--press);padding:var(--s4) 0 var(--s3);margin-bottom:var(--s3);
  border-bottom:1px solid var(--rule);
}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.filters select,.filters input{
  flex:1 1 auto;min-width:0;background:var(--well);border:1px solid var(--rule);
  border-radius:var(--radius-btn);padding:6px 8px;font-size:12.5px;
}
.crewgroup{
  padding:var(--s4) var(--s3) 6px;display:flex;align-items:baseline;gap:7px;color:var(--ghost);
}
.crewgroup::after{content:"";flex:1;height:1px;background:var(--rule)}
.cardrow{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:6px var(--s3) 6px 0;background:none;border:0;cursor:pointer;color:var(--pencil);
  position:relative;
}
.cardrow:hover{background:var(--well);color:var(--key)}
.cardrow[aria-current="true"]{background:var(--well);color:var(--key);font-weight:600}
.cardrow[aria-current="true"]::after{
  content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--color-cyan);
}
.cardrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.cardrow .cost{color:var(--ghost);font-size:11.5px}
/* faction ink: a band flush to the column edge, so the roster reads as four ink columns */
.fbar{width:4px;height:26px;flex:none;border-radius:0 2px 2px 0}
/* balance: fill channel. In tolerance is a hollow ring — quiet on purpose. */
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.good{box-shadow:inset 0 0 0 1.5px var(--ghost)}
.dot.warning{background:var(--warning)}
.dot.serious{background:var(--serious)}
.dot.critical{background:var(--critical)}
.dot.none{border-radius:var(--radius-chip);box-shadow:inset 0 0 0 1.5px var(--edge)}

/* ---------- sections ------------------------------------------------------
   Panels used to be border + radius + background, thirty times down the page,
   which flattened everything into one grey stack. A section is now space and a
   hairline; only things you touch get a surface. */
.panel{
  border-top:1px solid var(--rule);padding:var(--s4) 0 var(--s5);margin:0;
}
.panel h3{
  font-family:var(--display);font-size:19px;font-weight:400;letter-spacing:.005em;
  text-transform:uppercase;color:var(--color-ink);
}
.panel>h3{margin-bottom:var(--s3)}
.panel>h3+label.fl{margin-top:0}
.screentitle{font-family:var(--display);font-size:clamp(28px,2.6vw,38px);font-weight:400;
  letter-spacing:-.005em;text-transform:uppercase;line-height:1}
.modal{
  background:var(--bench);border:1px solid var(--edge);border-radius:var(--radius-card);
  padding:var(--s4) var(--s5) var(--s5);box-shadow:var(--shadow);
}
.modal h3{font-family:var(--display);font-size:27px;font-weight:400;text-transform:uppercase;margin-bottom:var(--s2)}

/* ---------- THE PROOF ---------------------------------------------------- */
/* face · words · arithmetic. All three at once, because pricing a card you cannot
   currently read is how a card ends up costed for what you remember it doing. */
.proof{
  display:grid;grid-template-columns:230px minmax(300px,1.05fr) minmax(290px,1fr);
  gap:var(--s5);padding:var(--s4) 0 var(--s5);position:relative;align-items:start;
}
@media(max-width:1560px){
  /* the bench narrows when the rail is up: words below, full width, still above the fold */
  .proof{grid-template-columns:230px minmax(0,1fr);}
  .proof>.facetext{grid-column:1/-1;order:3;padding-top:var(--s3);border-top:1px solid var(--color-border)}
}
@media(max-width:820px){.proof{grid-template-columns:1fr}.cardface{max-width:280px}}

/* the card as an object: 5:7, art bled to the edges, faction ink down the spine */
.cardface{
  position:relative;aspect-ratio:5/7;border-radius:var(--radius-card);background:var(--well);
  perspective:1400px;
}
.flipper{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.7,.2,1);
}
.cardface.flipped .flipper{transform:rotateY(180deg)}
.side{
  position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;border-radius:var(--radius-card);
  border:1px solid var(--edge);background:var(--well);box-shadow:var(--shadow);
}
.side.back{transform:rotateY(180deg)}
.side img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.side .noart{
  display:grid;place-items:center;height:100%;text-align:center;padding:var(--s3);
  color:var(--ghost);font-size:11.5px;line-height:1.4;
}
.spine{position:absolute;left:0;top:0;bottom:0;width:5px;z-index:3}
.plate{
  position:absolute;left:0;right:0;bottom:0;padding:30px 11px 10px 14px;z-index:2;
  background:linear-gradient(transparent,rgba(6,4,10,.82) 46%,rgba(6,4,10,.94));
  pointer-events:none;
}
.plate .cname{
  font-family:var(--display);font-size:18px;font-weight:400;line-height:1;color:#fff;
  letter-spacing:0;text-transform:uppercase;
}
.plate .cstats{
  display:flex;gap:9px;margin-top:6px;font-family:var(--data);font-size:11px;color:#e6e0d4;
}
.plate .cstats span{opacity:.7}
.plate .cstats b{font-weight:600;opacity:1}
.pip{
  position:absolute;top:10px;left:12px;z-index:3;width:27px;height:27px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--data);font-size:13px;font-weight:700;
  color:#fff;background:rgba(6,4,10,.72);border:1.5px solid rgba(255,255,255,.7);
}
.faceswitch{display:flex;gap:4px;margin-top:9px}
.faceswitch button{
  flex:1;font-family:var(--data);font-size:10.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;padding:6px 4px;border:1px solid var(--rule);background:none;
  color:var(--ghost);cursor:pointer;border-radius:var(--radius-chip);
}
.faceswitch button[aria-pressed="true"]{border-color:var(--color-cyan);color:var(--color-cyan)}
.faceswitch button:hover{color:var(--pencil)}
.zoomlink{
  display:block;width:100%;margin-top:6px;background:none;border:0;cursor:pointer;
  color:var(--ghost);font-size:11px;text-align:center;padding:2px;
}
.zoomlink:hover{color:var(--key)}

/* the verdict: the one place this tool is allowed to shout */
.verdictblock{display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap}
.heronum{
  font-family:var(--display);font-size:clamp(58px,6vw,84px);line-height:.86;font-weight:400;
  letter-spacing:-.01em;color:var(--color-ink);font-variant-numeric:tabular-nums;
}
.heronum.off{color:var(--critical)}
.herolabel{margin-bottom:8px;display:block;color:var(--color-cyan)}
.verdictword{
  font-family:var(--display);font-size:21px;font-weight:400;letter-spacing:.01em;
  text-transform:uppercase;line-height:1.05;margin-top:2px;
}
.verdictwhy{font-size:12px;color:var(--pencil);margin-top:5px;max-width:34ch}
.good-c{color:var(--good)} .warning-c{color:var(--warning)}
.serious-c{color:var(--serious)} .critical-c{color:var(--critical)}
.good-bg{background:var(--good)} .warning-bg{background:var(--warning)}
.serious-bg{background:var(--serious)} .critical-bg{background:var(--critical)}
.glyph{
  width:17px;height:17px;border-radius:50%;display:inline-grid;place-items:center;
  font-size:10px;font-weight:700;flex:none;color:var(--press);
}
/* The glyph's ink is always the page ground, which clears 4.5:1 against all four
   fills in both themes. It used to force #fff on the two warm fills, which put a
   white mark on orange at 3.1:1 — the exact thing the rest of this file avoids. */
.swatch{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* ---------- the ledger: the budget as a receipt ---------- */
.ledger{
  font-family:var(--data);font-size:12px;line-height:1.75;margin-top:var(--s4);
  max-width:400px;
}
.ledger div{display:flex;align-items:baseline;gap:var(--s2)}
.ledger .lbl{color:var(--pencil);white-space:nowrap}
.ledger .dots{flex:1;border-bottom:1px dotted var(--edge);transform:translateY(-3px)}
.ledger .v{color:var(--key);font-variant-numeric:tabular-nums}
.ledger .total{border-top:1px solid var(--edge);margin-top:4px;padding-top:4px;font-weight:700}
.ledger .gap{margin-top:var(--s3)}
.ledger .neg .v{color:var(--critical)}

.meter{margin-top:var(--s3);max-width:460px}
.meter .cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--pencil);margin-bottom:5px;gap:var(--s2)}
.meter .cap b{color:var(--key);font-size:12px}
.track{height:9px;border-radius:var(--radius-chip);position:relative;overflow:hidden;background:var(--well)}
.fill{height:100%;transition:width .14s ease-out}
@media(prefers-reduced-motion:reduce){
  .fill{transition:none} .flipper{transition:none}
}
/* the budget is a hard mark on the track, not a colour change — you can see the
   exact point the card stopped being affordable */
.budgetmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--key)}
.breakdown{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3);font-size:11.5px;color:var(--pencil)}
.breakdown b{color:var(--key)}

/* ---------- card header ---------- */
.cardhead h2{font-family:var(--display);font-size:clamp(24px,2.2vw,32px);font-weight:400;
  letter-spacing:-.005em;line-height:1.02;text-transform:uppercase;text-wrap:balance}
.cardhead .meta{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--ghost)}
.fchip{display:inline-flex;align-items:center;gap:6px;color:var(--pencil)}
.path{font-family:var(--data);font-size:10.5px}

/* ---------- controls ---------- */
.grid{display:grid;gap:var(--s3)}
.stats{grid-template-columns:repeat(5,1fr);max-width:600px}
@media(max-width:760px){.stats{grid-template-columns:repeat(3,1fr)}}
.stepper{background:var(--well);border:1px solid var(--rule);border-radius:var(--radius-btn);padding:9px 8px;text-align:center}
.stepper:focus-within{border-color:var(--edge)}
.stepper .ctl{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px}
.stepper input{
  width:44px;text-align:center;font-size:20px;font-weight:600;background:none;border:0;padding:0;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type=number]{-moz-appearance:textfield}
.sbtn{
  width:23px;height:23px;border-radius:var(--radius-chip);border:1px solid var(--rule);background:var(--bench);
  cursor:pointer;line-height:1;font-size:14px;color:var(--ghost);flex:none;
}
.sbtn:hover{border-color:var(--color-cyan);color:var(--color-cyan)}

.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-chip);
  border:1px solid var(--rule);background:var(--well);cursor:pointer;font-size:12.5px;
  color:var(--pencil);
}
.chip:hover{border-color:var(--edge);color:var(--key)}
.chip[aria-pressed="true"]{border-color:var(--color-cyan);background:var(--color-cyan-tint);color:var(--color-cyan);font-weight:600}
.famlabel{
  align-self:center;margin:0 2px 0 var(--s3);padding-left:var(--s3);
  border-left:1px solid var(--gridline);line-height:1.9;
}
.chips>.famlabel:first-child{border-left:0;padding-left:0;margin-left:0}
.chip.faded{opacity:.4}
.chip.faded[aria-pressed="true"]{opacity:1}
.chip .pts{color:var(--ghost);font-size:11px}
.chip[aria-pressed="true"] .pts{color:var(--pencil)}

.efsearch{width:100%;background:var(--well);border:1px solid var(--rule);border-radius:var(--radius-btn);padding:7px 9px;font-size:12.5px}
.eflist{max-height:270px;overflow-y:auto;border:1px solid var(--rule);border-radius:var(--radius-btn);margin-top:var(--s2)}
.efrow{display:flex;align-items:flex-start;gap:9px;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--rule)}
.efrow:last-child{border-bottom:0}
.efrow:hover{background:var(--well)}
.efrow input{accent-color:var(--color-cyan);flex:none}
.efrow .nm{flex:1;min-width:0}
.efrow .pts{color:var(--pencil);font-size:12px}
.efrow .d{font-size:11px;color:var(--ghost);line-height:1.35;margin-top:2px}
.sel{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--s2)}
.tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 5px 3px 9px;
  border-radius:var(--radius-chip);background:var(--lift);border:1px solid var(--rule);font-family:var(--data);
}
.tag button{background:none;border:0;cursor:pointer;color:var(--ghost);padding:0 3px;font-size:14px;line-height:1}
.tag button:hover{color:var(--critical)}

textarea{
  width:100%;background:var(--well);border:1px solid var(--rule);border-radius:var(--radius-btn);
  padding:9px 10px;resize:vertical;line-height:1.6;font-size:13px;
}
textarea:hover,.efsearch:hover{border-color:var(--edge)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--color-cyan);box-shadow:0 0 0 3px var(--color-cyan-glow)}
label.fl{display:block;margin:var(--s4) 0 6px}
select{background:var(--well);border:1px solid var(--rule);border-radius:var(--radius-btn);padding:6px 8px}

/* ---------- rail ---------- */
.railsec{border-bottom:1px solid var(--rule);padding:var(--s4) var(--s3)}
.railsec h3{margin-bottom:var(--s2)}
#lightbox{
  position:fixed;inset:0;z-index:100;background:rgba(8,6,12,.94);display:grid;place-items:center;
  padding:var(--s5);cursor:zoom-out;backdrop-filter:blur(3px);
}
#lightbox[hidden]{display:none}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--radius-btn)}
#lightbox .lbcap{position:fixed;top:var(--s4);left:0;right:0;text-align:center;color:#fff;font-size:12px}

.weakness{
  border-left:2px solid var(--color-cyan);padding:2px 0 2px 12px;margin-top:var(--s3);
  font-style:italic;color:var(--pencil);font-size:12.5px;line-height:1.5;
}
.lorefield{margin-bottom:var(--s4)}
.lorefield .hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.lorefield .nm{
  font-family:var(--data);font-size:10.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--pencil);
}
.lorefield.done .nm{color:var(--key)}
.lorefield .req{font-family:var(--data);font-size:9.5px;letter-spacing:.16em;color:var(--color-orange)}
.lorefield .why{font-size:11.5px;color:var(--ghost);line-height:1.5;margin:4px 0 6px}
.lorefield .ctx{
  font-size:11.5px;color:var(--pencil);border-left:2px solid var(--color-cyan);padding:4px 0 4px 10px;
  margin:0 0 7px;font-style:italic;line-height:1.45;
}
.loremeter{display:flex;gap:3px;margin:4px 0 var(--s3)}
.loremeter i{flex:1;height:3px;background:var(--rule)}
.loremeter i.on{background:var(--color-cyan)}

/* ---------- gates: pass/fail stamps on a proof ---------- */
.gatepills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s2)}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--radius-chip);
  border:1px solid var(--rule);background:var(--well);font-family:var(--data);font-size:12px;
  font-weight:500;letter-spacing:.12em;color:var(--color-ink-60);
}
.pill.ok .glyph{background:none;color:var(--ghost);box-shadow:inset 0 0 0 1px var(--edge)}
.pill.bad{border-color:var(--critical);color:var(--key)}
.pill .glyph{width:14px;height:14px;font-size:8.5px}
.gate{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.gate:last-child{border-bottom:0}
.gate .gid{font-family:var(--data);font-weight:700;flex:none;width:24px;color:var(--pencil)}
.gate .msg{flex:1;color:var(--pencil)}
.humangates{margin-top:var(--s3);border-top:1px solid var(--rule);padding-top:var(--s3);display:grid;gap:6px}
.hg{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;cursor:pointer;color:var(--pencil)}
.hg:hover{color:var(--key)}
.hg input{accent-color:var(--color-cyan);margin-top:2px;flex:none}
.hg b{flex:none;width:24px;font-family:var(--data)}

/* ---------- neighbours ---------- */
.sib{width:100%;border-collapse:collapse;font-size:12px}
.sib th{text-align:left;padding:0 8px 7px 0}
.sib td{padding:6px 8px 6px 0;border-top:1px solid var(--rule)}
.sib td.nm{font-family:var(--text);font-variant-numeric:normal}
.sib tr.self td{color:var(--key);font-weight:700;background:var(--well)}
.sib tr.off td{color:var(--ghost)}

/* ---------- savebar ---------- */
#savebar{
  position:fixed;left:var(--roster);right:var(--rail);bottom:0;z-index:30;
  display:flex;align-items:center;gap:var(--s3);justify-content:flex-end;
  background:linear-gradient(transparent,var(--press) 38%);padding:var(--s5) var(--s5) var(--s4);
  pointer-events:none;
}
#savebar>*{pointer-events:auto}
@media(max-width:1240px){#savebar{right:0}}
@media(max-width:820px){#savebar{left:0}}
#savebar[hidden]{display:none}
#dirtynote{font-family:var(--data);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-orange)}
.primary{
  background:var(--color-orange);color:var(--color-bg);border:0;border-radius:var(--radius-btn);
  padding:10px 20px;font-family:var(--text);font-size:13px;font-weight:600;letter-spacing:.01em;
  cursor:pointer;box-shadow:0 0 0 0 var(--color-orange-glow);
  transition:background .18s ease,box-shadow .25s ease,transform .12s ease;
}
.primary:hover{background:var(--color-orange-hover);box-shadow:0 8px 30px var(--color-orange-glow);transform:translateY(-1px)}
.primary:active{background:var(--color-orange-press);transform:translateY(0);box-shadow:none}
.primary:disabled{opacity:.5;cursor:default}
.ghost{
  background:var(--bench);border:1px solid var(--rule);border-radius:var(--radius-btn);padding:8px 14px;
  cursor:pointer;color:var(--pencil);font-size:12.5px;
}
.ghost:hover{color:var(--color-ink);border-color:var(--color-ink-60);background:var(--color-bg-card)}

/* ---------- notices ---------- */
.stub{
  border-left:2px solid var(--warning);padding:10px 13px;background:var(--well);
  margin:var(--s3) 0;font-size:12.5px;line-height:1.5;
}

/* ---------- the score ---------- */
.scorebar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:var(--s3) 0 var(--s2);
  font-size:12px;color:var(--pencil);
}
.scorebar .step{display:flex;align-items:baseline;gap:5px}
.scorebar .step b{font-size:15px;color:var(--key)}
.scorebar .arrow{color:var(--ghost);font-size:11.5px}
.scorebar .final{
  padding:4px 11px;border:1px solid var(--color-cyan);border-radius:var(--radius-chip);color:var(--color-cyan);
  font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-weight:400;
}
.creditgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px;margin-top:6px}
.credit{background:var(--well);border:1px solid var(--rule);border-radius:var(--radius-btn);padding:9px}
.credit .lb{font-size:11px;color:var(--pencil);line-height:1.35;min-height:30px}
.credit .rw{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.credit .val{display:flex;align-items:center;gap:5px}
.credit input{width:32px;text-align:center;background:none;border:0;font-size:16px;font-weight:600;padding:0}
.credit input::-webkit-outer-spin-button,.credit input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.credit input[type=number]{-moz-appearance:textfield}
.credit .pts{font-size:10.5px;color:var(--ghost)}
.credit.on{border-color:var(--color-cyan)}
.tests{display:grid;gap:4px;margin-top:8px;border-top:1px solid var(--rule);padding-top:7px}
.tests select{border-radius:var(--radius-chip);padding:3px 5px;font-size:11px;width:100%}
.windows{display:grid;gap:4px;margin-top:4px}
.win{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;cursor:pointer;padding:6px 8px;border-radius:var(--radius-btn);border:1px solid transparent;color:var(--pencil)}
.win:hover{background:var(--well)}
.win.on{border-color:var(--color-cyan);background:var(--color-cyan-tint);color:var(--color-ink)}
.win input{accent-color:var(--color-cyan);margin-top:3px;flex:none}
.win .q{color:var(--ghost);font-size:11.5px}
.proh{display:grid;gap:4px;margin-top:var(--s3);border-top:1px solid var(--rule);padding-top:var(--s3)}

/* ---------- matrix ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.matrix{width:100%;border-collapse:collapse;font-size:12.5px}
.matrix th{padding:8px 6px;text-align:center;font-family:var(--data);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--pencil);border-bottom:1px solid var(--edge)}
.matrix th.rowh{text-align:left}
.matrix td{padding:0;border:1px solid var(--rule);vertical-align:top}
.matrix td.rowh{padding:9px 8px;font-weight:600;border:0;border-bottom:1px solid var(--rule)}
.cell{min-height:46px;padding:5px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.cell.empty{background:repeating-linear-gradient(45deg,transparent,transparent 6px,var(--rule) 6px,var(--rule) 7px)}
.mini{font-size:10.5px;padding:2px 6px;border-radius:3px;background:var(--well);border:1px solid var(--rule);cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:var(--pencil)}
.mini:hover{border-color:var(--color-cyan);color:var(--color-cyan)}
.mini.over{border-color:var(--critical);color:var(--key)}

/* ---------- tables & health ---------- */
.wingrid{width:100%;border-collapse:collapse;font-size:12.5px}
.wingrid th{padding:8px;border-bottom:1px solid var(--edge);text-align:center;font-family:var(--data);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--pencil)}
.wingrid td{padding:8px;border-bottom:1px solid var(--rule);text-align:center;color:var(--pencil)}
.wingrid th:first-child,.wingrid td:first-child{text-align:left;color:var(--key)}
.lvl{
  display:inline-block;padding:2px 10px;border-radius:var(--radius-chip);font-family:var(--data);font-size:10.5px;
  font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border:1px solid var(--rule);
}
.lvl.strong{border-color:var(--color-cyan);color:var(--color-cyan)}
.lvl.weak{border-color:var(--edge);color:var(--pencil)}
.lvl.blind{color:var(--ghost);border-style:dashed}
.kpi{border-left:2px solid var(--rule);padding:2px 0 2px 13px}
.kpi .v{font-family:var(--display);font-size:34px;font-weight:400;line-height:1}
.kpi .l{margin-top:3px;display:block}
.bar{height:7px;border-radius:var(--radius-chip);background:var(--well);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

.tools{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--s2)}
.tool{font-size:11.5px;padding:3px 9px;border-radius:var(--radius-chip);border:1px solid var(--rule);background:var(--well);cursor:pointer;color:var(--pencil)}
.tool:hover{border-color:var(--edge);color:var(--key)}
.tool.uniq{border-color:var(--color-cyan);color:var(--color-cyan);background:var(--color-cyan-tint)}
.tool.never{border-color:var(--critical);color:var(--pencil);text-decoration:line-through}
.tool.taken{opacity:.4;cursor:not-allowed}

/* ---------- library ---------- */
.libwrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);align-items:start}
@media(max-width:1100px){.libwrap{grid-template-columns:1fr}}
.librow{display:flex;gap:11px;padding:10px 12px;border-bottom:1px solid var(--rule);cursor:pointer;align-items:flex-start}
.librow:hover{background:var(--well)}
.librow[aria-current="true"]{background:var(--well);box-shadow:inset 2px 0 0 var(--color-cyan)}
.librow .pt{font-weight:700;min-width:26px;text-align:right;flex:none;color:var(--pencil)}
.librow .bd{flex:1;min-width:0}
.librow .t{font-weight:600;font-size:13px}
.librow .d{font-size:11.5px;color:var(--ghost);line-height:1.45;margin-top:3px}
.librow .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag2{font-family:var(--data);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid var(--rule);color:var(--ghost)}
.tag2.uniq{border-color:var(--color-cyan);color:var(--color-cyan)}
.tag2.unused{border-color:var(--warning);color:var(--warning)}
.libtabs{display:flex;gap:var(--s1);margin-top:var(--s3)}
.libtabs .mode{height:auto;padding:6px 12px;border:1px solid var(--rule);border-radius:var(--radius-chip);font-size:11.5px}
.libtabs .mode[aria-current="true"]{border-color:var(--color-cyan);color:var(--color-cyan)}
.libtabs .mode[aria-current="true"]::after{display:none}
.kwdefs{margin-top:var(--s3);border-top:1px solid var(--rule);padding-top:var(--s3);display:grid;gap:6px}
.kwdef{font-size:11.5px;line-height:1.5;color:var(--ghost)}
.kwdef b{color:var(--pencil)}
.kwdef.on{color:var(--pencil)}
.kwdef.on b{color:var(--color-cyan)}

/* ---------- problems ---------- */
.listpane{border:1px solid var(--rule);border-radius:var(--radius-btn);overflow:auto;background:var(--bench)}
.listpane>*:last-child{border-bottom:0}
.finding{display:flex;gap:11px;padding:11px 12px;border-bottom:1px solid var(--rule);align-items:flex-start}
.finding .code{font-family:var(--data);font-weight:700;flex:none;width:34px;color:var(--pencil)}
.finding.err .code{color:var(--critical)}
.finding.warn .code{color:var(--warning)}
.finding .body{flex:1;min-width:0}
.finding .sub{font-weight:600}
.finding .fx{color:var(--ghost);font-size:11.5px;margin-top:4px}

#toast{
  position:fixed;left:50%;bottom:var(--s5);transform:translateX(-50%);background:var(--color-bg-raised);
  color:var(--color-ink);border:1px solid var(--color-border-med);border-radius:var(--radius-btn);
  padding:12px 20px;z-index:60;font-size:13px;font-weight:500;
  box-shadow:var(--shadow);max-width:min(560px,90vw);
}
#toast[hidden]{display:none}

/* ---------- tooltips ------------------------------------------------------
   Every abbreviation in this tool is jargon: PA, G3, W12, Reach, Ceiling, Σ.
   Anything with an explanation gets a dotted underline and shows it on hover
   AND on keyboard focus, so the shorthand is never the only thing on offer. */
[data-tip]{cursor:help}
.term{
  text-decoration:underline dotted var(--color-ink-40);text-underline-offset:3px;
  text-decoration-thickness:1px;
}
.term:hover,.term:focus-visible{text-decoration-color:var(--color-cyan)}
#tip{
  position:fixed;z-index:200;max-width:340px;pointer-events:none;
  background:var(--color-bg-raised);border:1px solid var(--color-border-med);
  border-radius:var(--radius-btn);box-shadow:var(--shadow);padding:10px 13px;
  font-size:12.5px;line-height:1.5;color:var(--color-ink-80);
  opacity:0;transition:opacity .12s ease;
}
#tip[hidden]{display:none}
#tip.show{opacity:1}
#tip b{
  display:block;font-family:var(--data);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--color-cyan);margin-bottom:5px;font-weight:500;
}
@media(prefers-reduced-motion:reduce){#tip{transition:none}}

/* ---------- printed text: the card's own words ---------------------------- */
.facetext{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.facetext .side-rule{
  display:flex;align-items:center;gap:var(--s2);font-family:var(--data);font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--color-ink-60);
}
.facetext .side-rule::after{content:"";flex:1;height:1px;background:var(--color-border)}
.facetext .side-rule.lvl::before{
  content:"";width:7px;height:7px;border-radius:50%;background:var(--color-cyan);flex:none;
}
.cardtext{
  width:100%;background:var(--color-bg-input);border:1px solid var(--color-border);
  border-left:2px solid var(--color-border-med);border-radius:0 var(--radius-btn) var(--radius-btn) 0;
  padding:11px 14px;font-family:var(--text);font-size:13.5px;line-height:1.72;
  color:var(--color-ink);resize:none;overflow:hidden;min-height:52px;display:block;
}
.cardtext:hover{border-color:var(--color-border-med)}
.cardtext:focus{outline:none;border-color:var(--color-cyan);border-left-color:var(--color-cyan);
  box-shadow:0 0 0 3px var(--color-cyan-glow)}
.cardtext::placeholder{color:var(--color-ink-40);font-style:italic}
.textlabel{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);margin-bottom:5px;
}
.textlabel .cnt{font-family:var(--data);font-size:10.5px;color:var(--color-ink-60)}
</style>
</head>
<body>
<div id="dotgrid" aria-hidden="true"></div>
<div id="app">
  <header id="masthead">
    <div class="wordmark">
      <span class="colorbar" aria-hidden="true">
        <i style="background:var(--f-warmongers)"></i><i style="background:var(--f-overthinkers)"></i><i style="background:var(--f-assholes)"></i><i style="background:var(--f-icons)"></i>
      </span>
      <b>Card Studio</b>
    </div>
    <nav id="modes" aria-label="Screens"></nav>
    <div class="mastright">
      <span class="muted" id="poolcount"></span>
      <button class="iconbtn" id="theme" title="Toggle light and dark" aria-label="Toggle light and dark">◐</button>
    </div>
  </header>

  <div id="list" class="col">
    <div class="topbar">
      <div class="row" id="cardactions" style="gap:6px">
        <button class="ghost" id="newcard" style="padding:6px 11px;font-size:12px">+ New card</button>
        <button class="ghost" id="clonecard" style="padding:6px 11px;font-size:12px">Clone</button>
      </div>
      <div class="filters" id="cardfilters">
        <input id="q" placeholder="Search name, effect, keyword, text…" aria-label="Search cards">
        <select id="ffac" aria-label="Filter by faction"><option value="">All factions</option></select>
        <select id="fbal" aria-label="Filter by balance">
          <option value="">All balance</option>
          <option value="off">Outside tolerance</option>
          <option value="good">In tolerance</option>
          <option value="stub">Stubs</option>
        </select>
      </div>
    </div>
    <div id="rows"></div>
  </div>

  <div id="main" class="col"><div class="muted" style="padding:40px 0">Loading…</div></div>

  <div id="rail" class="col"><div id="raildyn"></div></div>
</div>

<div id="savebar" hidden>
  <span id="dirtynote">Unsaved changes</span>
  <button class="ghost" id="revert">Revert</button>
  <button class="primary" id="save">Save to file</button>
</div>
<div id="lightbox" hidden><div class="lbcap"></div><img alt=""></div>
<div id="toast" hidden></div>
<div id="tip" hidden role="tooltip"></div>
<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,p={},...kids)=>{const n=document.createElement(t);
  for(const[k,v] of Object.entries(p)){
    if(k==="class")n.className=v; else if(k==="text")n.textContent=v;
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);
    /* aria-* wants the literal strings "true"/"false"; a bare "" neither styles nor announces */
    else if(typeof v==="boolean"){
      if(k.startsWith("aria-")) n.setAttribute(k,String(v));
      else if(v) n.setAttribute(k,"");
    }
    else if(v!==null&&v!==undefined)n.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null) n.append(c.nodeType?c:document.createTextNode(c));
  return n;};
const esc = s => String(s??"");

const FACTION_VAR = {Warmongers:"--f-warmongers",Overthinkers:"--f-overthinkers",
                     Assholes:"--f-assholes",Icons:"--f-icons"};
const GLYPH = {good:"✓",warning:"!",serious:"!",critical:"✕"};
const VERDICT_WORD = {good:"In tolerance",warning:"Slightly off",serious:"Off",critical:"Badly off"};

let DB=null, cards=[], current=null, draft=null;

/* ================= GLOSSARY =============================================================
   Every abbreviation this tool prints. Definitions are lifted from the rulebook and the
   rubrics -- docs/rulebook/06-character-anatomy.md for the stats, 13-glossary.md for the
   universal terms, docs/rubrics/gameplay-rubric.md for the gates, and
   docs/design/balance-philosophy.md for The Score. The validation codes — F…, W… and GAP —
   are NOT here: they come from the server as DB.ruleDocs, read off the rule functions
   themselves, so a tooltip can never drift from what the checker actually does.
   ===================================================================================== */
const GLOSSARY = {
  Cost:["Energy cost","What the card costs to play, and the number the whole budget is derived from: (cost × 3) + 1, plus 3 for an Ascendant."],
  PA:["Physical Attack","Damage dealt by physical strikes. The default stat in a standard Combat Wave."],
  PH:["Physical Health","Physical stamina. At 0 the Character is Murdered. All PH damage is permanent and persists across Rounds."],
  MA:["Mental Attack","Damage dealt by psychological strikes. Reaches the board through Tactics, Attachments and specific abilities — not standard combat unless the card says so."],
  MH:["Mental Health","Mental fortitude. At 0 the Character is Murdered, exactly like PH."],

  G1:["Gate G1 — stays under its Ceiling","Power is earned, not capped. The card may spend up to its Ceiling and no further."],
  G2:["Gate G2 — every term is defined","Every rules term on the card already exists in the rulebook or data/. No card may be the first place a mechanic is defined."],
  G3:["Gate G3 — ability type declared","Every printed ability states its type — Standard, Fast, Trigger or Passive — and the type must be capable of what the text says."],
  G4:["Gate G4 — faction keyword exclusivity","A card carries keywords only from its own faction. No exceptions, including Ascendants. Cross-faction power comes through crew, never keywords."],
  G5:["Gate G5 — no unbounded loop","The card cannot produce infinite Energy, damage, cards or Influence with any existing card."],
  G6:["Gate G6 — deterministic resolution","Two players reading the card reach the same board state. Who chooses, how many, and in what order must all be explicit."],
  G7:["Gate G7 — answerability","At least one existing card can answer this, including from the poorest-tooled faction."],
  G8:["Gate G8 — art and identity present","art.base resolves to a real file, the card has a faction, and a Character has a crew or an explicit null with a reason in Design Notes."],
  G9:["Gate G9 — the friendship gate","Losing to this card must feel like being outplayed or roasted, never robbed or insulted. These are real people. Not a joke gate."],

  budget:["Base Budget","(cost × 3) + 1, plus 3 if the card is an Ascendant. What the printed cost entitles the card to spend."],
  credits:["Credits","Points earned by paying in a currency other than Energy — setup, telegraph, sacrifice, cards, life, matchup narrowness."],
  allowance:["Allowance","Base Budget plus credits. What the card has earned before Reach caps it."],
  ceiling:["Ceiling","The hard limit on what this card may spend: the lower of its Allowance and its Reach cap. Four prohibitions no Ceiling buys past."],
  reach:["Reach","How many factions can answer this card using tools their own toolkit allows — not how many windows it offers. Reach 0 is not printable."],
  window:["Interaction window","A real moment where the opponent can stop the plan. Each one must name a specific existing card or rule; every window raises the Ceiling by 25%."],
  headroom:["Headroom","Ceiling minus what the card actually spends. Negative means it is over and cannot be printed as written."],
  impact:["Spend","Stats plus keyword points plus effect points. What the card actually costs against its budget."],
  tolerance:["Tolerance","How far off budget a card may sit before it counts as off. Under-spending is as wrong as over-spending; it just fails quietly."],

  sigma:["Σ — total stat points","PA + PH + MA + MH added together. The share of the budget spent on raw numbers rather than ideas."],
  delta:["Δ — distance from budget","Points over (+) or under (−) the base budget. ±0 is exactly on."],

  Ascendant:["Ascendant","A Character that levels up mid-game into a second, stronger face. Capped at 5 per 40-card deck."],
  Descendant:["Descendant","A standard Character with one face. The backbone of a deck — a 40-card deck wants about 24."],
  Tactic:["Tactic","A one-shot card played through a Caster of matching faction."],
  Attachment:["Attachment","A persistent card attached to a Character."],
  Arena:["Arena","A card that changes a rule of the game symmetrically, for both players."],

  strong:["Strong","This faction can answer a plan in this window using tools its toolkit already allows."],
  weak:["Weak","This faction has a partial or conditional answer here."],
  blind:["Blind","This faction has no answer in this window at all."],

  unique:["Unique","Only this faction may have this tool. Marking the same tool unique to two factions is a hard error."],
  never:["Never","This faction may never have this tool, even though other factions share it."],
  shared:["Shared","Any faction may use this, unless a faction has explicitly marked it never."],

  Job:["Job","The position a Character plays for its crew — not a keyword. A keyword is a Role: one of the tools it plays the position with."],
  Formation:["Formation","The five-person structure a crew declares: four required Jobs and one free slot."],
  coordinated:["Coordinated","The crew advances one shared plan, and cards may enable each other."],
  chaotic:["Chaotic","Not an exemption from validation, a different rule: no card may require a state a crewmate produces, and none may reference its own crew. In exchange those cards get a higher individual rate."],

  draft:["Draft","Not yet scored or reviewed. Exempt from the budget gate."],
  ported:["Ported","Carried over from the original spreadsheet, numbers intact, not yet re-reviewed."],
  reviewed:["Reviewed","Read against both rubrics and passed."],
  playtested:["Playtested","Has been played in at least one logged game."],
  final:["Final","Locked. Change it only with a very good reason."],
  retired:["Retired","Out of the pool, kept on disk so the Design Notes survive."],

  P1:["P1 — no self-restarting payoff","The payoff may not pay for its own repetition."],
  P2:["P2 — no passive lock","No card may shut the opponent out with no action required from its controller."],
  P3:["P3 — no unbounded repetition","Trigger and Passive abilities bypass the alternating-action structure, so they may not repeat without a bound."],
  P4:["P4 — no cheap + wide + uninterruptible","A card may have two of the three. Never all three."],
};

/* term -> [title, body]; codes come from the server so they track rules.py */
function glossaryFor(key){
  if(GLOSSARY[key]) return GLOSSARY[key];
  if(key.startsWith("family:")){
    const fam=key.slice(7);
    const names=(DB.jobs||[]).filter(j=>j.family===fam).map(j=>j.name);
    if(names.length) return [`${fam} Jobs`,
      `The ${fam} family: ${names.join(", ")}. A Job is the position a Character plays for its crew.`];
    return null;
  }
  const doc=(DB&&DB.ruleDocs)?DB.ruleDocs[key]:null;
  if(doc) return [/^GAP$/.test(key)?"GAP — an unfilled hole":`${key} — validation check`, doc];
  return null;
}

/* Attach an explanation to a node. Works on hover and on keyboard focus, because a
   tooltip only reachable by mouse is a tooltip half the people cannot read. */
function tipped(node, key, {underline=true}={}){
  const g=glossaryFor(key);
  if(!g) return node;
  node.dataset.tipTitle=g[0];
  node.dataset.tip=g[1];
  if(underline) node.classList.add("term");
  if(node.tabIndex<0 && !/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(node.tagName)) node.tabIndex=0;
  return node;
}
/* a bare <span> carrying a term, e.g. the PA in a table header */
const term = (key, label) => tipped(el("span",{text:label??key}), key);

/* Faction and crew already carry a written identity in data/. Show it where the card
   names them, rather than making you leave the screen to remember what a crew is for. */
function factionChip(name){
  const chip=el("span",{class:"fchip"},
    el("span",{class:"dot",style:`background:var(${FACTION_VAR[name]||"--edge"})`}),
    name||"No faction");
  const b=(DB.factions||{})[name];
  if(b && b.identity){
    chip.dataset.tipTitle=`${name} — how they win`;
    chip.dataset.tip=b.identity.split(". ").slice(0,2).join(". ")+".";
    chip.classList.add("term"); chip.tabIndex=0;
  }
  return chip;
}
function crewChip(name){
  const chip=el("span",{text:name||"No crew"});
  const c=crewByName(name);
  if(c && (c.plan||"").trim()){
    chip.dataset.tipTitle=`${name} — the crew plan`;
    chip.dataset.tip=c.plan.trim();
    chip.classList.add("term"); chip.tabIndex=0;
  }
  return chip;
}

function initTips(){
  const box=$("#tip");
  let shown=null;
  const hide=()=>{ shown=null; box.classList.remove("show"); box.hidden=true; };
  const show=node=>{
    if(shown===node) return;
    shown=node;
    box.replaceChildren(el("b",{text:node.dataset.tipTitle||""}), node.dataset.tip);
    box.hidden=false;
    const r=node.getBoundingClientRect();
    box.style.left="0px"; box.style.top="0px";           // measure unconstrained
    const w=box.offsetWidth, h=box.offsetHeight, pad=10;
    const left=Math.min(Math.max(pad, r.left), innerWidth-w-pad);
    let top=r.top-h-8;                                   // above by default
    if(top<pad) top=r.bottom+8;                          // flip under when it would clip
    top=Math.min(Math.max(pad, top), innerHeight-h-pad); // and never leave the viewport
    box.style.left=`${left}px`; box.style.top=`${top}px`;
    box.classList.add("show");
  };
  const target=e=>e.target.closest?.("[data-tip]");
  document.addEventListener("pointerover",e=>{ const t=target(e); t?show(t):hide(); });
  document.addEventListener("pointerdown",hide);
  document.addEventListener("focusin",e=>{ const t=target(e); t?show(t):hide(); });
  document.addEventListener("focusout",hide);
  addEventListener("scroll",hide,true);
  addEventListener("keydown",e=>{ if(e.key==="Escape") hide(); });
}

/* ---------------- scoring (mirrors tools/scoring.py; constants come from the server) --- */
function budgetOf(meta){
  const c=DB.constants;
  const isAsc=(meta.subtype||"").toLowerCase()==="ascendant";
  return Number(meta.cost)*c.costMultiplier + c.baseAllowance + (isAsc?c.ascendantBonus:0);
}
const pointsOf=(names,table)=>(names||[]).reduce((a,n)=>a+(table[n]??0),0);

function scoreDraft(d){
  const m=d.meta, stats=m.stats||{};
  const full = DB.statKeys.every(k=>stats[k]!==null&&stats[k]!==undefined&&stats[k]!=="");
  if(m.cost===null||m.cost===undefined||m.cost==="") return {scorable:false,reason:"no cost defined"};
  if(!full) return {scorable:false,reason:"incomplete stat line"};
  const budget=budgetOf(m);
  const statsTotal=DB.statKeys.reduce((a,k)=>a+Number(stats[k]||0),0);
  const bk=pointsOf(m.base?.keywords,DB.kwPts), be=pointsOf(m.base?.effects,DB.efPts);
  const ak=pointsOf(m.ascended?.keywords,DB.kwPts), ae=pointsOf(m.ascended?.effects,DB.efPts);
  const baseSpent=statsTotal+bk+be, ascSpent=ak+ae;
  const ascBudget=Math.trunc(budget*DB.constants.ascendedMultiplier);
  return {scorable:true,budget,statsTotal,baseKeywordPoints:bk,baseEffectPoints:be,
    ascendedKeywordPoints:ak,ascendedEffectPoints:ae,baseSpent,ascendedSpent:ascSpent,
    baseDelta:budget-baseSpent, ascendedBudget:ascBudget,
    ascendedDelta:ascBudget-(baseSpent+ascSpent)};
}
/* Two-sided on the base budget: underspending is as wrong as overspending. */
function severity(delta){
  const c=DB.constants, m=Math.abs(delta);
  for(const [t,label] of c.severityBands) if(m<=t) return label;
  return c.severityWorst;
}
/* One-sided on the ascended budget: ×1.5 is a ceiling, so spending under it is fine. */
function ceilingSeverity(delta){
  if(delta>=0) return "good";
  const m=Math.abs(delta);
  for(const [t,label] of DB.constants.severityBands) if(m<=t&&t>0) return label;
  return DB.constants.severityWorst;
}

/* ---------------- gates (mirrors tools/scoring.py) ------------------------------------ */
function gatesOf(d){
  const m=d.meta, out={G1:[],G3:[],G4:[],G6:[],G8:[]}, s=scoreDraft(d);
  if(s.scorable){
    const p=scorePlan(s);
    if(p.hasPlan){
      if(p.headroom<0) out.G1.push(`spends ${p.total} against a Ceiling of ${p.ceiling} — over by ${-p.headroom}`);
    } else {
      if(Math.abs(s.baseDelta)>DB.constants.tolerance)
        out.G1.push(`base side ${s.baseDelta<0?"over":"under"} budget by ${Math.abs(s.baseDelta)}`);
      if((m.subtype||"").toLowerCase()==="ascendant" && s.ascendedDelta<0)
        out.G1.push(`ascended side exceeds base budget ×${DB.constants.ascendedMultiplier} by ${Math.abs(s.ascendedDelta)} (OQ-04)`);
    }
  }
  const known=new Set([...DB.abilityTypes,...Object.keys(DB.kwPts)]);
  for(const text of [d.rulesText,d.ascendedText]){
    for(const mm of esc(text).matchAll(/\[([^\]]+)\]\s*(\([^)]*\))?/g)){
      const [,name,declared]=mm;
      if(DB.abilityTypes.includes(name)) continue;
      if(!declared) out.G3.push(`ability [${name}] declares no ability type`);
      else if(!known.has(declared.slice(1,-1))) out.G3.push(`ability [${name}] declares unknown type '${declared.slice(1,-1)}'`);
    }
  }
  for(const side of ["base","ascended"])
    for(const kw of (m[side]?.keywords||[])){
      const owner=DB.kwFaction[kw];
      if(!owner) out.G4.push(`unknown keyword '${kw}' on ${side} side`);
      else if(owner!==m.faction) out.G4.push(`${side} keyword '${kw}' belongs to ${owner}, card is ${m.faction}`);
    }
  const blob=`${esc(d.rulesText)}\n${esc(d.ascendedText)}`.toLowerCase();
  const applied=DB.statuses.map(s=>s.name).filter(n=>n&&new RegExp(`\\b${n.toLowerCase()}\\b`).test(blob));
  if(applied.length && !DB.durationPhrases.some(p=>blob.includes(p)))
    out.G6.push(`applies status (${applied.join(", ")}) with no stated duration`);
  if(!m.faction) out.G8.push("no faction");
  if(!m.art?.base) out.G8.push("no base art reference");
  if(!("crew" in m)) out.G8.push("crew key absent");
  return out;
}

/* ---------------- list ---------------------------------------------------------------- */
function listSeverity(c){
  const s=c===current?scoreDraft(draft):c.score;
  return s.scorable?severity(s.baseDelta):"none";
}
function renderList(){
  if(MODE==="library"){ $("#rows").replaceChildren(); return; }
  if(MODE==="factions"||MODE==="crews"){
    const rows=$("#rows"); rows.replaceChildren();
    const items = MODE==="factions" ? (DB.factionData||[]) : (DB.crews||[]);
    const sel   = MODE==="factions" ? selFaction : selCrew;
    for(const it of items){
      const n = MODE==="factions" ? cardsOf(it.name).length : cardsOf(null,it.name).length;
      rows.append(el("button",{class:"cardrow","aria-current":sel&&sel.key===it.key,
        onclick:()=>{ if(MODE==="factions") selFaction=it; else selCrew=it; renderList(); renderMain(); }},
        el("span",{class:"fbar",style:`background:var(${FACTION_VAR[it.name]||"--baseline"})`}),
        el("span",{class:"nm",text:it.name}),
        it.reviewed?null:el("span",{class:"dot warning",style:"background:var(--warning)",title:"unreviewed draft"}),
        el("span",{class:"cost",text:String(n)})));
    }
    return;
  }
  if(MODE!=="cards"){ $("#rows").replaceChildren(); return; }
  const q=$("#q").value.toLowerCase(), fac=$("#ffac").value, bal=$("#fbal").value;
  const rows=$("#rows"); rows.replaceChildren();
  const groups=new Map();
  for(const c of cards){
    const m=c.meta, sev=listSeverity(c);
    /* search the whole card, not just the name -- "counterspell" or "prowler" should find
       every card that uses it */
    const hay=[m.name,m.crew,m.faction,m.subtype,m.status,
               ...(m.base?.effects||[]),...(m.base?.keywords||[]),
               ...(m.ascended?.effects||[]),...(m.ascended?.keywords||[]),
               c.rulesText,c.ascendedText].join(" ").toLowerCase();
    if(q && !hay.includes(q)) continue;
    if(fac && m.faction!==fac) continue;
    if(bal==="off" && (sev==="none"||sev==="good")) continue;
    if(bal==="good" && sev!=="good") continue;
    if(bal==="stub" && sev!=="none") continue;
    const key=m.crew||"Unassigned";
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(c);
  }
  if(!groups.size){ rows.append(el("div",{class:"crewgroup",text:"No cards match"})); return; }
  for(const [crew,items] of [...groups].sort((a,b)=>a[0].localeCompare(b[0]))){
    rows.append(el("div",{class:"crewgroup",text:`${crew} · ${items.length}`}));
    for(const c of items){
      const sev=listSeverity(c);
      rows.append(el("button",{class:"cardrow","aria-current":c===current,
          onclick:()=>select(c)},
        el("span",{class:"fbar",style:`background:var(${FACTION_VAR[c.meta.faction]||"--baseline"})`}),
        el("span",{class:`dot ${sev}`,title:sev}),
        el("span",{class:"nm",text:c.meta.name}),
        el("span",{class:"cost",text:c.meta.cost??"–"})));
    }
  }
}

/* ---------------- main surface -------------------------------------------------------- */
function meter(label, spent, budget, sev, note){
  const max=Math.max(spent,budget,1);
  const pct=v=>Math.min(100,(v/max)*100);
  return el("div",{class:"meter"},
    el("div",{class:"cap"},
      el("span",{},label),
      el("span",{}, el("b",{text:String(spent)}), " / ", el("b",{text:String(budget)}), note?el("span",{class:"muted",text:" "+note}):null)),
    /* the budget is a hard mark on the track rather than a colour change, so you can see
       the exact point the card stopped being affordable */
    el("div",{class:"track"},
      el("div",{class:"fill",style:`width:${pct(spent)}%;background:var(--${sev})`}),
      el("div",{class:"budgetmark",style:`left:calc(${pct(budget)}% - 1px)`,title:`budget ${budget}`})));
}

/* ---------------- the proof ------------------------------------------------------------
   The card as an object, next to the arithmetic that decides whether it can be printed.
   Built once per card and updated in place: the artwork is multi-megabyte and renderMain
   runs on every keystroke, so rebuilding the <img> here would flash on every edit. */
let PROOF=null;
function buildProof(){
  PROOF=null;
  if(!current) return;
  const art=draft.art||{};
  const face=(side,label)=>{
    const a=art[side]||{};
    const inner = a.url
      ? el("img",{src:a.url,alt:`${draft.meta.name} — ${label}`})
      : el("div",{class:"noart"}, el("div",{},
          el("div",{class:"slug",text:label}),
          el("div",{style:"margin-top:6px"},
            a.ref?`No file matches “${a.ref}”`:"No art reference set")));
    return inner;
  };
  const spine=el("div",{class:"spine"});
  const pip=el("div",{class:"pip"});
  const cname=el("div",{class:"cname"});
  const cstats=el("div",{class:"cstats"});
  const front=el("div",{class:"side front"}, face("base","Base"), spine, pip,
                 el("div",{class:"plate"}, cname, cstats));
  const back =el("div",{class:"side back"}, face("ascended","Level-up"),
                 el("div",{class:"plate"}, el("div",{class:"slug",style:"color:#cfc8bb",
                   text:"Level-up side"})));
  const card=el("div",{class:"cardface"}, el("div",{class:"flipper"}, front, back));

  const sw=el("div",{class:"faceswitch"});
  const show=key=>{
    PROOF.face=key;
    card.classList.toggle("flipped", key==="ascended");
    for(const b of sw.children) b.setAttribute("aria-pressed", String(b.dataset.k===key));
  };
  for(const [key,label] of [["base","Base"],["ascended","Level-up"]])
    sw.append(el("button",{"data-k":key,"aria-pressed":key==="base",text:label,
      onclick:()=>show(key)}));
  const zoom=el("button",{class:"zoomlink",text:"Open full artwork",onclick:()=>{
    const a=art[PROOF.face]||{};
    if(a.url) lightbox(a.url,`${draft.meta.name} — ${PROOF.face==="base"?"Base":"Level-up"} · ${a.path}`);
    else toast("No artwork on that side yet");
  }});
  PROOF={node:el("div",{}, card, sw, zoom), card, spine, pip, cname, cstats, face:"base"};
}
function syncProof(){
  if(!PROOF) return;
  const m=draft.meta;
  PROOF.spine.style.background=`var(${FACTION_VAR[m.faction]||"--edge"})`;
  PROOF.pip.textContent = (m.cost===null||m.cost===undefined||m.cost==="") ? "–" : String(m.cost);
  PROOF.cname.textContent = m.name||"Untitled";
  PROOF.cstats.replaceChildren(...DB.statKeys.map(k=>
    el("span",{}, k+" ", el("b",{text:String(m.stats?.[k] ?? "–")}))));
}

/* one row of the receipt: label, leader dots, right-aligned figure */
function line(label, value, cls=""){
  return el("div",{class:cls},
    el("span",{class:"lbl",text:label}),
    el("span",{class:"dots"}),
    el("span",{class:"v",text:String(value)}));
}

/* A card-text field: the card's own words, set like printed text rather than like a form.
   Grows to fit so there is never a scrollbar inside the card's voice. */
function cardText(label, key, placeholder, tipKey){
  const ta=el("textarea",{class:"cardtext",placeholder,
    oninput:e=>{ draft[key]=e.target.value; grow(e.target); touch(false); }}, draft[key]||"");
  const count=el("span",{class:"cnt"});
  const grow=n=>{ n.style.height="auto"; n.style.height=Math.max(52,n.scrollHeight+2)+"px";
                  count.textContent=(n.value||"").trim()?`${n.value.trim().length} chars`:"empty"; };
  requestAnimationFrame(()=>grow(ta));
  const lbl=el("span",{class:"slug",text:label});
  if(tipKey) tipped(lbl, tipKey);
  return el("div",{}, el("div",{class:"textlabel"}, lbl, count), ta);
}

/* The card's words, next to the card's face, next to the card's arithmetic. Reading the
   text and the budget in two different scroll positions is how a card gets priced without
   anyone re-reading what it actually does. */
function faceText(){
  return el("div",{class:"facetext"},
    el("div",{class:"side-rule",text:"Base side"}),
    cardText("Rules text","rulesText",
      "[Ability Name] (Standard Ability): what it does, who chooses, how many.","G3"),
    el("div",{class:"side-rule lvl",text:"Level-up"}),
    cardText("Level-up condition","levelupCondition",
      "What has to happen for this Character to ascend.","Ascendant"),
    cardText("Ascended rules text","ascendedText",
      "[Improved Ability] (Fast Ability): what changes once it has ascended.","G3"));
}

function proofPanel(s){
  syncProof();
  const m=draft.meta;
  const right=el("div",{});
  if(s.scorable){
    const sev=severity(s.baseDelta), asev=ceilingSeverity(s.ascendedDelta);
    const over=s.baseDelta<0;
    right.append(
      el("span",{class:"herolabel",text:"Base side against budget"}),
      el("div",{class:"verdictblock"},
        el("div",{class:`heronum ${sev==="good"?"":"off"}`,
          text:`${s.baseDelta===0?"":over?"+":"−"}${Math.abs(s.baseDelta)}`}),
        el("div",{style:"flex:1;min-width:180px"},
          el("div",{class:`verdictword ${sev}-c`},
            el("span",{class:`glyph ${sev}-bg`,text:GLYPH[sev]}), " ",
            s.baseDelta===0?"Exactly on budget"
              :`${Math.abs(s.baseDelta)} ${over?"over":"under"} — ${VERDICT_WORD[sev]}`),
          el("div",{class:"verdictwhy",
            text: over ? "This card is stronger than its cost pays for. Cut points, raise the cost, or declare a plan that earns a higher ceiling."
                : s.baseDelta>0 ? "This card is weaker than its cost pays for. Underpowered is as wrong as overpowered here — it just fails quietly instead of loudly."
                : "The card spends exactly what its cost buys."}))),
      /* one ledger, two totals: what the cost entitles it to, and what it actually spent.
         The old layout said this three times over -- a breakdown row, a budget sentence

function stepper(label, value, onChange, min=0){

function planOf(){
  draft.meta.plan = draft.meta.plan || {};
  draft.meta.plan.pays = draft.meta.plan.pays || {};
  draft.meta.plan.windows = draft.meta.plan.windows || [];
  return draft.meta.plan;
}

/* Mirrors scoring.py. Credits earn the Allowance; Reach CAPS it.
   Each cost is discounted by the three tests (bite / timing / enabler). */
function costFactor(key){
  const scales=DB.plan.cost_tests||{}, chosen=(planOf().tests||{})[key]||{};
  let f=1;
  for(const [test,opts] of Object.entries(scales)){
    const ans=chosen[test];
    if(ans!==undefined && opts[ans]!==undefined) f*=Number(opts[ans]);
  }
  return f;
}
function scorePlan(s){
  const cfg=DB.plan, plan=planOf();
  const table=Object.fromEntries(cfg.credits.map(c=>[c.key,c]));
  let credits=0;
  for(const [k,q] of Object.entries(plan.pays)){
    const e=table[k]; if(!e||!q) continue;
    let raw=e.points*q;
    if(k==="narrowness") raw=Math.min(raw,cfg.narrowness_cap);
    credits+=Math.trunc(raw*costFactor(k));
  }
  const valid=new Set(cfg.windows.map(w=>w.key));
  const windows=plan.windows.filter(w=>valid.has(w)).length;
  const declared = credits>0 || windows>0 || plan.reach!=null;
  const reach = plan.reach!=null ? Math.max(0,Math.min(4,plan.reach))
              : (windows>0 ? Math.min(4,windows) : null);
  const allowance=s.budget+credits;
  const caps=cfg.reach_caps||{};
  let cap;
  if(reach===null) cap=s.budget;                       // no plan: the original rule
  else {
    const mult = caps[reach]!==undefined ? caps[reach] : caps[String(reach)];
    cap = (mult===null||mult===undefined) ? null : Math.trunc(s.budget*Number(mult));
  }
  const ceiling = cap===null ? 0 : Math.min(allowance,cap);
  const total=s.baseSpent+s.ascendedSpent;
  return {credits,windows,reach,allowance,earned:allowance,cap,ceiling,total,
          headroom:ceiling-total, hasPlan:declared};
}

  for(const [id,fails] of Object.entries(g)){

        title:fails.join("; ")||"pass"},
      el("span",{class:`glyph ${ok?"good":"critical"}-bg`,text:ok?"✓":"✕"}), id),
      id, {underline:false}));
  }
  wrap.append(pills);
  const failing=Object.entries(g).filter(([,f])=>f.length);

  return wrap;
}

function siblingTable(){
  const m=draft.meta;
  const cost=m.cost;
  const inRange = c => cost!==null && cost!==undefined
    && c.meta.cost!==null && c.meta.cost!==undefined
    && Math.abs(c.meta.cost-cost)<=1;
  /* One cost either side, not just exact matches -- at the tails of the curve an exact-cost
     filter often returns the card itself, which compares it to nothing. */
  const sibs=cards.filter(inRange)
    .sort((a,b)=>(a.meta.cost-b.meta.cost)||a.meta.name.localeCompare(b.meta.name));
  const tbl=el("table",{class:"sib"},
    el("thead",{}, el("tr",{}, ...["Card","","Cost",...DB.statKeys,"Σ","Δ"].map(h=>{
      const key = h==="Σ" ? "sigma" : h==="Δ" ? "delta" : h;
      return el("th",{}, glossaryFor(key) ? term(key,h) : h);
    }))));
  const tb=el("tbody",{});
  for(const c of sibs){
    const isSelf=c===current, cs=isSelf?scoreDraft(draft):c.score;
    const st=isSelf?(m.stats||{}):(c.meta.stats||{});
    const sev=cs.scorable?severity(cs.baseDelta):"none";
    tb.append(el("tr",{class:isSelf?"self":(c.meta.cost===cost?"":"off")},
      el("td",{class:"nm",text:isSelf?m.name:c.meta.name}),
      el("td",{class:"nm"}, el("span",{class:"dot",style:`background:var(${FACTION_VAR[c.meta.faction]||"--baseline"})`})),
      el("td",{text:String(isSelf?cost:c.meta.cost)}),
      ...DB.statKeys.map(k=>el("td",{text:String(st[k]??"–")})),
      el("td",{class:"muted",text:cs.scorable?String(cs.statsTotal):"–"}),
      el("td",{}, cs.scorable
        ? el("span",{style:"font-weight:600"},
            el("span",{class:`swatch ${sev}-bg`}),
            (cs.baseDelta<0?"+":cs.baseDelta>0?"−":"±")+Math.abs(cs.baseDelta))
        : el("span",{class:"muted",text:"–"}))));
  }
  tbl.append(tb);
  const exact=sibs.filter(c=>c.meta.cost===cost).length;
  return el("div",{class:"panel"},
    el("div",{class:"row spread",style:"margin-bottom:10px"},
      el("h3",{
        text:`Neighbours — cost ${cost===null||cost===undefined?"—":`${Math.max(0,cost-1)}–${cost+1}`}`}),
      el("span",{class:"muted",style:"font-size:11.5px",
        text:`${exact} at cost ${cost ?? "—"} · ${sibs.length-exact} adjacent`})),
    sibs.length?tbl:el("div",{class:"muted",text:"Set a cost to compare against other cards."}),
    el("div",{class:"muted",style:"font-size:11.5px;margin-top:10px",
      text:"Σ is total stat points. Δ is points over (+) or under (−) budget. A 4-cost is only a 4-cost relative to its neighbours."}));
}

async function postJSON(url, body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},

  if(!r.ok || j.error) throw new Error(j.error||r.statusText);
  return j;
}

                             .map(f=>f.name);

async function libSave(entry, originalName){
  const j=await postJSON("/api/library",{kind:libKind,entry,originalName});
  if(libKind==="keywords") DB.keywords=j.rows; else if(libKind==="effects") DB.effects=j.rows;
  else DB.statuses=j.rows;
  DB.usage=j.usage; DB.findings=j.findings;
  DB.kwPts=Object.fromEntries((DB.keywords||[]).map(k=>[k.name,k.points]));
  DB.kwFaction=Object.fromEntries((DB.keywords||[]).map(k=>[k.name,k.faction]));
  DB.efPts=Object.fromEntries((DB.effects||[]).map(e=>[e.name,e.points]));
  renderModes(); renderMain(); renderList();
}

function renderLibrary(main){
  const meta=LIB_META[libKind];
  const rows=libRows(libKind);
  const usage=DB.usage||{};

  main.append(el("div",{class:"topbar"},
    el("div",{class:"row spread"},
      el("div",{},
        el("h2",{class:"screentitle",text:"Library"}),
        el("div",{class:"muted",style:"font-size:12px;margin-top:3px",
          text:"Every keyword, effect and status — what it means, who owns it, which cards use it"})),
      el("button",{class:"primary",onclick:()=>{
        libSel={__new:true,name:"",points:2,
                [meta.defKey]:"", ...(meta.hasFaction?{faction:(DB.factionData||[])[0]?.name}:{})};
        renderMain();
      }},`+ New ${meta.noun}`)),
    el("div",{class:"libtabs",style:"margin-top:10px"},
      ...Object.entries(LIB_META).map(([k,m])=>
        el("button",{class:"mode","aria-current":libKind===k,
          onclick:()=>{libKind=k; libSel=null; renderMain();}},

      placeholder:`Filter ${rows.length} ${meta.label.toLowerCase()}…`,

  /* ---- list ---- */
  const q=libQuery.toLowerCase();
  const list=el("div",{class:"listpane",style:"max-height:70vh"});
  const shown=rows.filter(r=>!q ||
    `${r.name} ${r[meta.defKey]||""} ${r.faction||""}`.toLowerCase().includes(q));
  const sorted=[...shown].sort((a,b)=>
    meta.hasFaction ? (a.faction||"").localeCompare(b.faction||"")||((a.points||0)-(b.points||0))
                    : ((a.points||0)-(b.points||0))||a.name.localeCompare(b.name));
  let lastGroup=null;
  for(const r of sorted){

      list.append(el("div",{class:"crewgroup",text:lastGroup||"unassigned"}));

      onclick:()=>{libSel={...r}; renderMain();}},

      el("div",{class:"bd"},
        el("div",{class:"t",text:r.name}),
        el("div",{class:"d",text:r[meta.defKey]||"— no definition written —"}),
        el("div",{class:"meta"},
          owner?tipped(el("span",{class:"tag2 uniq",text:`unique · ${owner}`}),"unique",{underline:false})
               :tipped(el("span",{class:"tag2 shared",text:"shared"}),"shared",{underline:false}),
          el("span",{class:used?"tag2":"tag2 unused",
            text:used?`${used} card${used===1?"":"s"}`:"unused"}),
          ...neverFor(libKind,r.name).map(f=>
            tipped(el("span",{class:"tag2",text:`never · ${f}`}),"never",{underline:false}))))));

  if(!sorted.length) list.append(el("div",{style:"padding:16px"},

  /* ---- editor ---- */
  let editor;

      el("textarea",{rows:"3",value:"",

          ...used.map(n=>el("button",{class:"chip",onclick:()=>{

      el("div",{class:"row",style:"gap:8px;margin-top:16px;justify-content:flex-end"},
        !isNew?el("button",{class:"ghost",onclick:async()=>{

          try{
            const j=await postJSON("/api/library/rename",{kind:libKind,old:libSel.name,new:next});
            toast(`Renamed across ${j.files} file(s)`);
            location.reload();
          }catch(e){ toast("Rename failed: "+e.message,6000); }

        !isNew?el("button",{class:"ghost",style:"border-color:var(--critical);color:var(--critical)",
          onclick:async()=>{

              if(j.blocked){

                            j.usedBy.join("\n")+`\n\nDelete anyway? They will fail validation.`)) return;
                j=await postJSON("/api/library/delete",{kind:libKind,name:libSel.name,force:true});
              }
              if(libKind==="keywords") DB.keywords=j.rows;
              else if(libKind==="effects") DB.effects=j.rows; else DB.statuses=j.rows;

          }},"Delete"):null,
        el("button",{class:"primary",onclick:async()=>{
          if(!(libSel.name||"").trim()) return toast("Give it a name");

               libSel={...entry}; toast("Saved — docs regenerated"); }

  }

  main.append(el("div",{class:"libwrap"}, list, editor));

        : covered.join(", "))));

  main.append(el("div",{class:"panel"},
    el("h3",{text:"Window profile — where they can answer a plan"}),
    wg,
    el("div",{class:"muted",style:"font-size:11.5px;margin-top:9px"},
      "Click a level to cycle strong → weak → blind. This map is what computes Reach on every card.")));

  /* toolkit */
  for(const [kind,title] of [["keywords","Keywords"],["effects","Effects"]]){
    const pool = kind==="keywords" ? DB.keywords.map(k=>k.name) : DB.effects.map(e=>e.name);
    const uniq=new Set(((f.unique||{})[kind])||[]);
    const never=new Set(((f.never||{})[kind])||[]);
    const wrap=el("div",{class:"tools"});
    for(const name of pool){
      const owner=uniqueOwner(kind,name,f.key);
      const cls = uniq.has(name)?"uniq" : never.has(name)?"never" : owner?"taken":"";
      wrap.append(el("button",{class:`tool ${cls}`,

      el("h3",{text:`${title} — unique / never`}),

        "blue = unique to this faction · red = never · faded = already unique to someone else"),
